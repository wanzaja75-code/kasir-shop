<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Kasir Scan - Produk</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
    <link rel="stylesheet" href="style.css" />

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .dark .glass-card {
            background: rgba(21, 32, 43, 0.8);
            border-color: rgba(255, 255, 255, 0.05);
        }
        .gradient-primary { background: linear-gradient(145deg, #0f2a44, #1a5f7a); }
        .hover-lift { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .hover-lift:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 20px 40px -12px rgba(0,0,0,0.15); }
        .dark .hover-lift:hover { box-shadow: 0 20px 40px -12px rgba(0,0,0,0.4); }
        .focus-ring { transition: all 0.3s ease; }
        .focus-ring:focus { ring: 4px solid rgba(26, 95, 122, 0.15); border-color: #1a5f7a; }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #1a5f7a, #4a9ab8); border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #3a6a8a, #5a9ab8); }
        
        .pulse-dot { animation: pulse-dot 2s ease-in-out infinite; }
        @keyframes pulse-dot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.2); } }
    </style>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { 500: '#1a5f7a', 600: '#154c62', 700: '#103949' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
</head>

<body x-data="kasirApp()" x-init="init()" :class="darkMode ? 'dark' : ''" class="min-h-screen p-3 md:p-5 transition-colors duration-500 bg-gray-50 dark:bg-[#0b1320]">

    <!-- HEADER PREMIUM -->
    <header class="relative rounded-2xl p-5 mb-4 overflow-hidden gradient-primary shadow-2xl shadow-[#0f2a44]/30">
        <div class="absolute inset-0 opacity-10">
            <svg class="w-full h-full" viewBox="0 0 100 100" preserveAspectRatio="none">
                <circle cx="80" cy="20" r="40" fill="white" />
                <circle cx="20" cy="80" r="30" fill="white" />
                <circle cx="50" cy="50" r="20" fill="white" />
            </svg>
        </div>
        <button @click="toggleTheme()" 
                class="absolute right-4 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 transition-all duration-300 flex items-center justify-center backdrop-blur-sm border border-white/10 hover:scale-110">
            <i class="fas text-lg" :class="darkMode ? 'fa-sun text-yellow-300' : 'fa-moon text-white'"></i>
        </button>
        <div class="text-center relative z-10">
            <div class="flex items-center justify-center gap-3 mb-1">
                <div class="w-12 h-12 rounded-2xl bg-white/10 backdrop-blur-sm flex items-center justify-center border border-white/20">
                    <i class="fas fa-boxes text-2xl text-white"></i>
                </div>
                <h1 class="text-2xl font-extrabold tracking-tight text-white">Manajemen<span class="text-blue-200">Produk</span></h1>
            </div>
            <p class="text-sm text-blue-100/80 font-light" x-text="datetime"></p>
        </div>
    </header>

    <!-- NAVIGASI PREMIUM -->
    <nav class="bg-white/80 dark:bg-[#15202b]/80 backdrop-blur-xl rounded-2xl p-1.5 mb-4 shadow-lg shadow-gray-200/50 dark:shadow-black/30 border border-gray-100/50 dark:border-gray-800/50">
        <div class="grid grid-cols-5 gap-0.5">
            <a href="index.html" class="py-3 rounded-xl hover:bg-gray-100 dark:hover:bg-[#1a2835] text-gray-500 dark:text-gray-400 text-xs font-semibold flex flex-col items-center gap-1 transition-all duration-300">
                <i class="fas fa-home text-base"></i><span>Beranda</span>
            </a>
            <a href="produk.html" class="py-3 rounded-xl bg-[#1a5f7a] text-white text-xs font-semibold flex flex-col items-center gap-1 transition-all duration-300 shadow-lg shadow-[#1a5f7a]/30">
                <i class="fas fa-boxes text-base"></i><span>Produk</span>
            </a>
            <a href="laporan.html" class="py-3 rounded-xl hover:bg-gray-100 dark:hover:bg-[#1a2835] text-gray-500 dark:text-gray-400 text-xs font-semibold flex flex-col items-center gap-1 transition-all duration-300">
                <i class="fas fa-chart-bar text-base"></i><span>Laporan</span>
            </a>
            <a href="wa.html" class="py-3 rounded-xl hover:bg-gray-100 dark:hover:bg-[#1a2835] text-gray-500 dark:text-gray-400 text-xs font-semibold flex flex-col items-center gap-1 transition-all duration-300">
                <i class="fab fa-whatsapp text-base"></i><span>WhatsApp</span>
            </a>
            <a href="pengaturan.html" class="py-3 rounded-xl hover:bg-gray-100 dark:hover:bg-[#1a2835] text-gray-500 dark:text-gray-400 text-xs font-semibold flex flex-col items-center gap-1 transition-all duration-300">
                <i class="fas fa-sliders-h text-base"></i><span>Settings</span>
            </a>
        </div>
    </nav>

    <!-- TAMBAH PRODUK -->
    <div class="bg-white/80 dark:bg-[#15202b]/80 backdrop-blur-xl rounded-2xl p-4 mb-4 shadow-lg shadow-gray-200/50 dark:shadow-black/30 border border-gray-100/50 dark:border-gray-800/50 transition-all duration-300 hover-lift">
        <h3 class="text-sm font-semibold text-gray-800 dark:text-gray-200 mb-3 flex items-center gap-2">
            <span class="w-8 h-8 rounded-full bg-emerald-500/20 flex items-center justify-center">
                <i class="fas fa-plus-circle text-emerald-500 text-sm"></i>
            </span>
            Tambah Produk Baru
        </h3>
        <div class="flex gap-1.5 flex-wrap">
            <input type="text" x-model="newProduct.barcode" placeholder="Kode" class="flex-1 min-w-[50px] px-3 py-2.5 rounded-xl border-2 border-gray-200 dark:border-gray-700 dark:bg-[#1a2835] dark:text-white text-sm focus:ring-4 focus:ring-[#1a5f7a]/15 focus:border-[#1a5f7a] outline-none transition-all duration-300 focus-ring">
            <input type="text" x-model="newProduct.name" placeholder="Nama" class="flex-1 min-w-[50px] px-3 py-2.5 rounded-xl border-2 border-gray-200 dark:border-gray-700 dark:bg-[#1a2835] dark:text-white text-sm focus:ring-4 focus:ring-[#1a5f7a]/15 focus:border-[#1a5f7a] outline-none transition-all duration-300 focus-ring">
            <select x-model="newProduct.category" class="px-3 py-2.5 rounded-xl border-2 border-gray-200 dark:border-gray-700 dark:bg-[#1a2835] dark:text-white text-sm focus:ring-4 focus:ring-[#1a5f7a]/15 focus:border-[#1a5f7a] outline-none transition-all duration-300">
                <option value="Makanan">🍜 Makanan</option>
                <option value="Minuman">🥤 Minuman</option>
                <option value="Snack">🍿 Snack</option>
                <option value="Rokok">🚬 Rokok</option>
                <option value="Lainnya">📦 Lainnya</option>
            </select>
            <select x-model="newProduct.unit" class="px-3 py-2.5 rounded-xl border-2 border-gray-200 dark:border-gray-700 dark:bg-[#1a2835] dark:text-white text-sm focus:ring-4 focus:ring-[#1a5f7a]/15 focus:border-[#1a5f7a] outline-none transition-all duration-300">
                <option value="Pcs">Pcs</option>
                <option value="Box">Box</option>
                <option value="Lusin">Lusin</option>
                <option value="Kg">Kg</option>
                <option value="Gram">Gram</option>
                <option value="Liter">Liter</option>
                <option value="Pack">Pack</option>
            </select>
            <input type="number" x-model="newProduct.price" placeholder="Harga" class="w-24 px-3 py-2.5 rounded-xl border-2 border-gray-200 dark:border-gray-700 dark:bg-[#1a2835] dark:text-white text-sm focus:ring-4 focus:ring-[#1a5f7a]/15 focus:border-[#1a5f7a] outline-none transition-all duration-300 focus-ring">
            <input type="number" x-model="newProduct.stock" placeholder="Stok" class="w-20 px-3 py-2.5 rounded-xl border-2 border-gray-200 dark:border-gray-700 dark:bg-[#1a2835] dark:text-white text-sm focus:ring-4 focus:ring-[#1a5f7a]/15 focus:border-[#1a5f7a] outline-none transition-all duration-300 focus-ring">
            <button @click="addNewProduct()" class="px-5 py-2.5 bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-600 hover:to-emerald-700 text-white font-bold rounded-xl transition-all duration-300 hover:shadow-xl hover:shadow-emerald-500/30 hover:scale-[1.02] active:scale-95 text-sm flex items-center gap-2">
                <i class="fas fa-plus"></i> Tambah
            </button>
        </div>
        <div x-show="uploadResult.message" class="mt-3 px-4 py-3 rounded-xl text-sm font-medium transition-all duration-500"
             :class="uploadResult.type === 'success' ? 'bg-emerald-50 dark:bg-emerald-950/20 text-emerald-700 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-800/30' : 'bg-red-50 dark:bg-red-950/20 text-red-700 dark:text-red-400 border border-red-200 dark:border-red-800/30'"
             x-text="uploadResult.message"></div>
    </div>

    <!-- DAFTAR PRODUK -->
    <div class="bg-white/80 dark:bg-[#15202b]/80 backdrop-blur-xl rounded-2xl p-4 shadow-lg shadow-gray-200/50 dark:shadow-black/30 border border-gray-100/50 dark:border-gray-800/50 transition-all duration-300 hover-lift">
        <div class="flex justify-between items-center mb-3">
            <h3 class="text-sm font-semibold text-gray-800 dark:text-gray-200 flex items-center gap-2">
                <span class="w-8 h-8 rounded-full bg-[#1a5f7a]/20 flex items-center justify-center">
                    <i class="fas fa-list text-[#1a5f7a] text-sm"></i>
                </span>
                Daftar Produk
                <span class="text-xs font-normal text-gray-400 ml-1" x-text="'(' + Object.keys(productDB).length + ')'"></span>
            </h3>
            <div class="relative">
                <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
                <input type="text" x-model="searchQuery" placeholder="Cari..." class="pl-8 pr-3 py-1.5 rounded-xl border-2 border-gray-200 dark:border-gray-700 dark:bg-[#1a2835] dark:text-white text-xs focus:ring-4 focus:ring-[#1a5f7a]/15 focus:border-[#1a5f7a] outline-none transition-all duration-300 w-32 focus:w-40 focus-ring">
            </div>
        </div>

        <div class="max-h-96 overflow-y-auto space-y-1">
            <template x-for="(product, code) in productDB" :key="code">
                <div class="flex items-center justify-between gap-1.5 p-2.5 bg-gray-50/80 dark:bg-[#1a2835]/80 rounded-xl border border-gray-100 dark:border-gray-800 hover:bg-gray-100/80 dark:hover:bg-[#1f3040]/80 transition-all duration-300 hover:scale-[1.01]">
                    <div class="flex-1 min-w-[60px]">
                        <span class="font-medium text-sm text-gray-800 dark:text-gray-200" x-text="product.name"></span>
                        <span class="text-xs text-gray-400 ml-1.5" x-text="'(' + code + ')'"></span>
                    </div>
                    <span class="text-xs font-semibold text-[#1a5f7a] dark:text-[#5a9ab8]" x-text="'Rp ' + formatNumber(product.price)"></span>
                    <span class="text-xs text-gray-500" x-text="product.unit || 'Pcs'"></span>
                    <span class="text-xs font-medium px-2 py-0.5 rounded-full"
                          :class="(product.stock || 0) > 10 ? 'bg-emerald-100 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-400' : (product.stock || 0) > 0 ? 'bg-orange-100 dark:bg-orange-900/30 text-orange-700 dark:text-orange-400' : 'bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-400'"
                          x-text="'Stok: ' + (product.stock || 0)"></span>
                    <button @click="generateSingleBarcode(code)" class="text-xs text-orange-500 hover:text-orange-600 transition-all duration-300 hover:scale-110 px-1.5">
                        <i class="fas fa-barcode"></i>
                    </button>
                    <button @click="deleteProduct(code)" class="text-xs text-red-400 hover:text-red-600 transition-all duration-300 hover:scale-110 px-1.5">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </div>
            </template>
            <template x-if="Object.keys(productDB).length === 0">
                <div class="text-center text-gray-400 dark:text-gray-600 py-8 text-sm">
                    <div class="w-12 h-12 mx-auto rounded-full bg-gray-100 dark:bg-[#1a2835] flex items-center justify-center mb-2">
                        <i class="fas fa-box-open text-xl text-gray-300 dark:text-gray-600"></i>
                    </div>
                    Belum ada produk
                </div>
            </template>
        </div>
    </div>

    <!-- MODAL BARCODE -->
    <div x-show="showBarcodeModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 p-4" 
         @click.away="showBarcodeModal = false"
         x-transition:enter.duration.300.opacity.scale
         x-transition:leave.duration.200.opacity.scale>
        <div class="bg-white dark:bg-[#15202b] rounded-2xl p-6 max-w-xs w-full shadow-2xl border border-gray-100 dark:border-gray-800">
            <h3 class="text-sm font-bold text-gray-800 dark:text-gray-200 mb-4 flex items-center gap-2">
                <span class="w-8 h-8 rounded-full bg-orange-500/20 flex items-center justify-center">
                    <i class="fas fa-barcode text-orange-500"></i>
                </span>
                Barcode
            </h3>
            <div class="flex justify-center p-4 bg-gray-50 dark:bg-[#1a2835] rounded-xl mb-4">
                <svg id="barcodeSVG" width="200" height="80"></svg>
            </div>
            <div class="flex gap-2">
                <button @click="downloadBarcode()" class="flex-1 py-2.5 bg-gradient-to-r from-orange-500 to-orange-600 hover:from-orange-600 hover:to-orange-700 text-white rounded-xl font-semibold text-xs transition-all duration-300 hover:shadow-xl hover:shadow-orange-500/30 hover:scale-[1.02] active:scale-95 flex items-center justify-center gap-2">
                    <i class="fas fa-download"></i> Download
                </button>
                <button @click="showBarcodeModal = false" class="flex-1 py-2.5 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-800 dark:text-white rounded-xl font-semibold text-xs transition-all duration-300 hover:scale-[1.02] active:scale-95">
                    Tutup
                </button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
