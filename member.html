<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Kasir Scan - Member</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="style.css" />

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; }
        .gradient-primary { background: linear-gradient(145deg, #0f2a44, #1a5f7a); }
        .hover-lift { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .hover-lift:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 20px 40px -12px rgba(0,0,0,0.15); }
        .dark .hover-lift:hover { box-shadow: 0 20px 40px -12px rgba(0,0,0,0.4); }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #1a5f7a, #4a9ab8); border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #3a6a8a, #5a9ab8); }
        
        .tier-gold { background: linear-gradient(145deg, #f59e0b, #d97706); }
        .tier-silver { background: linear-gradient(145deg, #9ca3af, #6b7280); }
        .tier-platinum { background: linear-gradient(145deg, #8b5cf6, #7c3aed); }
        .tier-bronze { background: linear-gradient(145deg, #d97706, #92400e); }
    </style>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { 500: '#1a5f7a', 600: '#154c62', 700: '#103949' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
</head>

<body x-data="kasirApp()" x-init="init()" :class="darkMode ? 'dark' : ''" class="min-h-screen p-3 md:p-5 transition-colors duration-500 bg-gray-50 dark:bg-[#0b1320]">

    <!-- HEADER PREMIUM -->
    <header class="relative rounded-2xl p-5 mb-4 overflow-hidden gradient-primary shadow-2xl shadow-[#0f2a44]/30">
        <div class="absolute inset-0 opacity-10">
            <svg class="w-full h-full" viewBox="0 0 100 100" preserveAspectRatio="none">
                <circle cx="80" cy="20" r="40" fill="white" />
                <circle cx="20" cy="80" r="30" fill="white" />
                <circle cx="50" cy="50" r="20" fill="white" />
            </svg>
        </div>
        <button @click="toggleTheme()" class="absolute right-4 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 transition-all duration-300 flex items-center justify-center backdrop-blur-sm border border-white/10 hover:scale-110">
            <i class="fas text-lg" :class="darkMode ? 'fa-sun text-yellow-300' : 'fa-moon text-white'"></i>
        </button>
        <div class="text-center relative z-10">
            <div class="flex items-center justify-center gap-3 mb-1">
                <div class="w-12 h-12 rounded-2xl bg-white/10 backdrop-blur-sm flex items-center justify-center border border-white/20">
                    <i class="fas fa-user-tie text-2xl text-white"></i>
                </div>
                <h1 class="text-2xl font-extrabold tracking-tight text-white">Member & <span class="text-blue-200">Poin</span></h1>
            </div>
            <p class="text-sm text-blue-100/80 font-light" x-text="datetime"></p>
        </div>
    </header>

    <!-- NAVIGASI -->
    <nav class="bg-white/80 dark:bg-[#15202b]/80 backdrop-blur-xl rounded-2xl p-1.5 mb-4 shadow-lg shadow-gray-200/50 dark:shadow-black/30 border border-gray-100/50 dark:border-gray-800/50">
        <div class="grid grid-cols-6 gap-0.5">
            <a href="index.html" class="py-3 rounded-xl hover:bg-gray-100 dark:hover:bg-[#1a2835] text-gray-500 dark:text-gray-400 text-xs font-semibold flex flex-col items-center gap-1 transition-all duration-300">
                <i class="fas fa-home text-base"></i><span>Beranda</span>
            </a>
            <a href="produk.html" class="py-3 rounded-xl hover:bg-gray-100 dark:hover:bg-[#1a2835] text-gray-500 dark:text-gray-400 text-xs font-semibold flex flex-col items-center gap-1 transition-all duration-300">
                <i class="fas fa-boxes text-base"></i><span>Produk</span>
            </a>
            <a href="laporan.html" class="py-3 rounded-xl hover:bg-gray-100 dark:hover:bg-[#1a2835] text-gray-500 dark:text-gray-400 text-xs font-semibold flex flex-col items-center gap-1 transition-all duration-300">
                <i class="fas fa-chart-bar text-base"></i><span>Laporan</span>
            </a>
            <a href="member.html" class="py-3 rounded-xl bg-[#1a5f7a] text-white text-xs font-semibold flex flex-col items-center gap-1 transition-all duration-300 shadow-lg shadow-[#1a5f7a]/30">
                <i class="fas fa-user-tie text-base"></i><span>Member</span>
            </a>
            <a href="hutang.html" class="py-3 rounded-xl hover:bg-gray-100 dark:hover:bg-[#1a2835] text-gray-500 dark:text-gray-400 text-xs font-semibold flex flex-col items-center gap-1 transition-all duration-300">
                <i class="fas fa-hand-holding-usd text-base"></i><span>Hutang</span>
            </a>
            <a href="pengaturan.html" class="py-3 rounded-xl hover:bg-gray-100 dark:hover:bg-[#1a2835] text-gray-500 dark:text-gray-400 text-xs font-semibold flex flex-col items-center gap-1 transition-all duration-300">
                <i class="fas fa-sliders-h text-base"></i><span>Settings</span>
            </a>
        </div>
    </nav>

    <!-- TAMBAH MEMBER -->
    <div class="bg-white/80 dark:bg-[#15202b]/80 backdrop-blur-xl rounded-2xl p-4 mb-4 shadow-lg shadow-gray-200/50 dark:shadow-black/30 border border-gray-100/50 dark:border-gray-800/50 transition-all duration-300 hover-lift">
        <h3 class="text-sm font-semibold text-gray-800 dark:text-gray-200 mb-3 flex items-center gap-2">
            <span class="w-8 h-8 rounded-full bg-emerald-500/20 flex items-center justify-center">
                <i class="fas fa-user-plus text-emerald-500 text-sm"></i>
            </span>
            Tambah Member Baru
        </h3>
        <div class="flex gap-2 flex-wrap">
            <input type="text" x-model="newMember.name" placeholder="Nama" class="flex-1 min-w-[80px] px-3 py-2.5 rounded-xl border-2 border-gray-200 dark:border-gray-700 dark:bg-[#1a2835] dark:text-white text-sm focus:ring-4 focus:ring-[#1a5f7a]/15 focus:border-[#1a5f7a] outline-none transition-all duration-300 focus-ring">
            <input type="text" x-model="newMember.phone" placeholder="No. HP" class="flex-1 min-w-[80px] px-3 py-2.5 rounded-xl border-2 border-gray-200 dark:border-gray-700 dark:bg-[#1a2835] dark:text-white text-sm focus:ring-4 focus:ring-[#1a5f7a]/15 focus:border-[#1a5f7a] outline-none transition-all duration-300 focus-ring">
            <button @click="addMember()" class="px-5 py-2.5 bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-600 hover:to-emerald-700 text-white font-bold rounded-xl transition-all duration-300 hover:shadow-xl hover:shadow-emerald-500/30 hover:scale-[1.02] active:scale-95 text-sm flex items-center gap-2">
                <i class="fas fa-plus"></i> Tambah
            </button>
        </div>
        <div x-show="uploadResult.message" class="mt-2 px-3 py-2 rounded-lg text-sm" :class="uploadResult.type === 'success' ? 'bg-emerald-50 text-emerald-700' : 'bg-red-50 text-red-700'" x-text="uploadResult.message"></div>
    </div>

    <!-- DAFTAR MEMBER -->
    <div class="bg-white/80 dark:bg-[#15202b]/80 backdrop-blur-xl rounded-2xl p-4 shadow-lg shadow-gray-200/50 dark:shadow-black/30 border border-gray-100/50 dark:border-gray-800/50 transition-all duration-300 hover-lift">
        <div class="flex justify-between items-center mb-3">
            <h3 class="text-sm font-semibold text-gray-800 dark:text-gray-200 flex items-center gap-2">
                <span class="w-8 h-8 rounded-full bg-[#1a5f7a]/20 flex items-center justify-center">
                    <i class="fas fa-users text-[#1a5f7a] text-sm"></i>
                </span>
                Daftar Member
                <span class="text-xs font-normal text-gray-400 ml-1" x-text="'(' + members.length + ')'"></span>
            </h3>
            <div class="relative">
                <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
                <input type="text" x-model="searchMember" placeholder="Cari member..." class="pl-8 pr-3 py-1.5 rounded-xl border-2 border-gray-200 dark:border-gray-700 dark:bg-[#1a2835] dark:text-white text-xs focus:ring-4 focus:ring-[#1a5f7a]/15 focus:border-[#1a5f7a] outline-none transition-all duration-300 w-32 focus:w-40 focus-ring">
            </div>
        </div>

        <div class="max-h-96 overflow-y-auto space-y-1.5">
            <template x-for="member in filteredMembers" :key="member.id">
                <div class="flex items-center justify-between gap-2 p-3 bg-gray-50/80 dark:bg-[#1a2835]/80 rounded-xl border border-gray-100 dark:border-gray-800 hover:bg-gray-100/80 dark:hover:bg-[#1f3040]/80 transition-all duration-300 hover:scale-[1.01]">
                    <div class="flex-1 min-w-[60px]">
                        <span class="font-medium text-sm text-gray-800 dark:text-gray-200" x-text="member.name"></span>
                        <span class="text-xs text-gray-400 ml-2" x-text="member.phone"></span>
                    </div>
                    <span class="text-xs font-semibold text-[#1a5f7a]" x-text="member.tier"></span>
                    <span class="text-xs font-medium px-2.5 py-1 rounded-full"
                          :class="member.tier === 'Platinum' ? 'bg-purple-100 dark:bg-purple-900/30 text-purple-700 dark:text-purple-400' :
                                  member.tier === 'Gold' ? 'bg-yellow-100 dark:bg-yellow-900/30 text-yellow-700 dark:text-yellow-400' :
                                  member.tier === 'Silver' ? 'bg-gray-100 dark:bg-gray-900/30 text-gray-700 dark:text-gray-400' :
                                  'bg-orange-100 dark:bg-orange-900/30 text-orange-700 dark:text-orange-400'"
                          x-text="member.poin + ' Poin'"></span>
                    <div class="flex gap-1">
                        <button @click="usePoin(member.id)" class="text-xs text-green-500 hover:text-green-600 transition-all duration-300 hover:scale-110 px-1.5">
                            <i class="fas fa-gift"></i>
                        </button>
                        <button @click="deleteMember(member.id)" class="text-xs text-red-400 hover:text-red-600 transition-all duration-300 hover:scale-110 px-1.5">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                </div>
            </template>
            <template x-if="filteredMembers.length === 0">
                <div class="text-center text-gray-400 dark:text-gray-600 py-6 text-sm">
                    <div class="w-12 h-12 mx-auto rounded-full bg-gray-100 dark:bg-[#1a2835] flex items-center justify-center mb-2">
                        <i class="fas fa-users text-xl text-gray-300 dark:text-gray-600"></i>
                    </div>
                    Belum ada member
                </div>
            </template>
        </div>
    </div>

    <!-- TIER MEMBER INFO -->
    <div class="mt-4 grid grid-cols-2 md:grid-cols-4 gap-2">
        <div class="bg-white/80 dark:bg-[#15202b]/80 rounded-xl p-3 text-center border border-gray-100 dark:border-gray-800">
            <span class="text-xs text-gray-400">🥉 Bronze</span>
            <p class="text-sm font-bold text-orange-600">0-100 Poin</p>
        </div>
        <div class="bg-white/80 dark:bg-[#15202b]/80 rounded-xl p-3 text-center border border-gray-100 dark:border-gray-800">
            <span class="text-xs text-gray-400">🥈 Silver</span>
            <p class="text-sm font-bold text-gray-600">100-300 Poin</p>
        </div>
        <div class="bg-white/80 dark:bg-[#15202b]/80 rounded-xl p-3 text-center border border-gray-100 dark:border-gray-800">
            <span class="text-xs text-gray-400">🥇 Gold</span>
            <p class="text-sm font-bold text-yellow-600">300-700 Poin</p>
        </div>
        <div class="bg-white/80 dark:bg-[#15202b]/80 rounded-xl p-3 text-center border border-gray-100 dark:border-gray-800">
            <span class="text-xs text-gray-400">💎 Platinum</span>
            <p class="text-sm font-bold text-purple-600">700+ Poin</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
