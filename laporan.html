<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Kasir Scan - Laporan</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="style.css" />

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; }
        .gradient-primary { background: linear-gradient(145deg, #0f2a44, #1a5f7a); }
        .hover-lift { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .hover-lift:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 20px 40px -12px rgba(0,0,0,0.15); }
        .dark .hover-lift:hover { box-shadow: 0 20px 40px -12px rgba(0,0,0,0.4); }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #1a5f7a, #4a9ab8); border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #3a6a8a, #5a9ab8); }
        
        .stat-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .stat-card:hover { transform: translateY(-4px) scale(1.02); }
    </style>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { 500: '#1a5f7a', 600: '#154c62', 700: '#103949' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
</head>

<body x-data="kasirApp()" x-init="init()" :class="darkMode ? 'dark' : ''" class="min-h-screen p-3 md:p-5 transition-colors duration-500 bg-gray-50 dark:bg-[#0b1320]">

    <!-- HEADER PREMIUM -->
    <header class="relative rounded-2xl p-5 mb-4 overflow-hidden gradient-primary shadow-2xl shadow-[#0f2a44]/30">
        <div class="absolute inset-0 opacity-10">
            <svg class="w-full h-full" viewBox="0 0 100 100" preserveAspectRatio="none">
                <circle cx="80" cy="20" r="40" fill="white" />
                <circle cx="20" cy="80" r="30" fill="white" />
                <circle cx="50" cy="50" r="20" fill="white" />
            </svg>
        </div>
        <button @click="toggleTheme()" 
                class="absolute right-4 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 transition-all duration-300 flex items-center justify-center backdrop-blur-sm border border-white/10 hover:scale-110">
            <i class="fas text-lg" :class="darkMode ? 'fa-sun text-yellow-300' : 'fa-moon text-white'"></i>
        </button>
        <div class="text-center relative z-10">
            <div class="flex items-center justify-center gap-3 mb-1">
                <div class="w-12 h-12 rounded-2xl bg-white/10 backdrop-blur-sm flex items-center justify-center border border-white/20">
                    <i class="fas fa-chart-bar text-2xl text-white"></i>
                </div>
                <h1 class="text-2xl font-extrabold tracking-tight text-white">Laporan<span class="text-blue-200">Penjualan</span></h1>
            </div>
            <p class="text-sm text-blue-100/80 font-light" x-text="datetime"></p>
        </div>
    </header>

    <!-- NAVIGASI PREMIUM -->
    <nav class="bg-white/80 dark:bg-[#15202b]/80 backdrop-blur-xl rounded-2xl p-1.5 mb-4 shadow-lg shadow-gray-200/50 dark:shadow-black/30 border border-gray-100/50 dark:border-gray-800/50">
        <div class="grid grid-cols-5 gap-0.5">
            <a href="index.html" class="py-3 rounded-xl hover:bg-gray-100 dark:hover:bg-[#1a2835] text-gray-500 dark:text-gray-400 text-xs font-semibold flex flex-col items-center gap-1 transition-all duration-300">
                <i class="fas fa-home text-base"></i><span>Beranda</span>
            </a>
            <a href="produk.html" class="py-3 rounded-xl hover:bg-gray-100 dark:hover:bg-[#1a2835] text-gray-500 dark:text-gray-400 text-xs font-semibold flex flex-col items-center gap-1 transition-all duration-300">
                <i class="fas fa-boxes text-base"></i><span>Produk</span>
            </a>
            <a href="laporan.html" class="py-3 rounded-xl bg-[#1a5f7a] text-white text-xs font-semibold flex flex-col items-center gap-1 transition-all duration-300 shadow-lg shadow-[#1a5f7a]/30">
                <i class="fas fa-chart-bar text-base"></i><span>Laporan</span>
            </a>
            <a href="wa.html" class="py-3 rounded-xl hover:bg-gray-100 dark:hover:bg-[#1a2835] text-gray-500 dark:text-gray-400 text-xs font-semibold flex flex-col items-center gap-1 transition-all duration-300">
                <i class="fab fa-whatsapp text-base"></i><span>WhatsApp</span>
            </a>
            <a href="pengaturan.html" class="py-3 rounded-xl hover:bg-gray-100 dark:hover:bg-[#1a2835] text-gray-500 dark:text-gray-400 text-xs font-semibold flex flex-col items-center gap-1 transition-all duration-300">
                <i class="fas fa-sliders-h text-base"></i><span>Settings</span>
            </a>
        </div>
    </nav>

    <!-- STATISTIK -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
        <div class="bg-white/80 dark:bg-[#15202b]/80 backdrop-blur-xl rounded-2xl p-4 shadow-lg shadow-gray-200/50 dark:shadow-black/30 border border-gray-100/50 dark:border-gray-800/50 stat-card">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-blue-500/20 flex items-center justify-center">
                    <i class="fas fa-receipt text-blue-500 text-sm"></i>
                </div>
                <div>
                    <p class="text-[10px] text-gray-400 uppercase tracking-wider">Transaksi</p>
                    <p class="text-xl font-extrabold text-gray-800 dark:text-gray-200" x-text="history.length"></p>
                </div>
            </div>
        </div>
        <div class="bg-white/80 dark:bg-[#15202b]/80 backdrop-blur-xl rounded-2xl p-4 shadow-lg shadow-gray-200/50 dark:shadow-black/30 border border-gray-100/50 dark:border-gray-800/50 stat-card">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-emerald-500/20 flex items-center justify-center">
                    <i class="fas fa-money-bill-wave text-emerald-500 text-sm"></i>
                </div>
                <div>
                    <p class="text-[10px] text-gray-400 uppercase tracking-wider">Penjualan</p>
                    <p class="text-xl font-extrabold text-emerald-600 dark:text-emerald-400" x-text="'Rp ' + formatNumber(totalSales)"></p>
                </div>
            </div>
        </div>
        <div class="bg-white/80 dark:bg-[#15202b]/80 backdrop-blur-xl rounded-2xl p-4 shadow-lg shadow-gray-200/50 dark:shadow-black/30 border border-gray-100/50 dark:border-gray-800/50 stat-card">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-purple-500/20 flex items-center justify-center">
                    <i class="fas fa-calculator text-purple-500 text-sm"></i>
                </div>
                <div>
                    <p class="text-[10px] text-gray-400 uppercase tracking-wider">Rata-rata</p>
                    <p class="text-xl font-extrabold text-purple-600 dark:text-purple-400" x-text="'Rp ' + formatNumber(averageSales)"></p>
                </div>
            </div>
        </div>
        <div class="bg-white/80 dark:bg-[#15202b]/80 backdrop-blur-xl rounded-2xl p-4 shadow-lg shadow-gray-200/50 dark:shadow-black/30 border border-gray-100/50 dark:border-gray-800/50 stat-card">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-orange-500/20 flex items-center justify-center">
                    <i class="fas fa-box text-orange-500 text-sm"></i>
                </div>
                <div>
                    <p class="text-[10px] text-gray-400 uppercase tracking-wider">Terjual</p>
                    <p class="text-xl font-extrabold text-orange-600 dark:text-orange-400" x-text="totalItemsSold + ' pcs'"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- PRODUK TERLARIS -->
    <div class="bg-white/80 dark:bg-[#15202b]/80 backdrop-blur-xl rounded-2xl p-4 mb-4 shadow-lg shadow-gray-200/50 dark:shadow-black/30 border border-gray-100/50 dark:border-gray-800/50 transition-all duration-300 hover-lift">
        <h3 class="text-sm font-semibold text-gray-800 dark:text-gray-200 mb-3 flex items-center gap-2">
            <span class="w-8 h-8 rounded-full bg-yellow-500/20 flex items-center justify-center">
                <i class="fas fa-trophy text-yellow-500 text-sm"></i>
            </span>
            Produk Terlaris
        </h3>
        <div class="space-y-1.5">
            <template x-for="(item, idx) in topProducts" :key="idx">
                <div class="flex items-center gap-3 p-2.5 bg-gray-50/80 dark:bg-[#1a2835]/80 rounded-xl border border-gray-100 dark:border-gray-800 transition-all duration-300 hover:bg-gray-100/80 dark:hover:bg-[#1f3040]/80 hover:scale-[1.01]">
                    <span class="text-xl" x-text="['🥇','🥈','🥉'][idx] || '•'"></span>
                    <span class="flex-1 text-sm font-medium text-gray-700 dark:text-gray-300" x-text="item.name"></span>
                    <span class="text-sm font-bold text-[#1a5f7a] dark:text-[#5a9ab8]" x-text="item.qty + ' pcs'"></span>
                    <span class="text-xs text-gray-400" x-text="'Rp ' + formatNumber(item.total)"></span>
                </div>
            </template>
            <template x-if="topProducts.length === 0">
                <div class="text-center text-gray-400 dark:text-gray-600 py-4 text-sm">
                    <div class="w-12 h-12 mx-auto rounded-full bg-gray-100 dark:bg-[#1a2835] flex items-center justify-center mb-2">
                        <i class="fas fa-chart-simple text-xl text-gray-300 dark:text-gray-600"></i>
                    </div>
                    Belum ada data penjualan
                </div>
            </template>
        </div>
    </div>

    <!-- PENJUALAN PER HARI -->
    <div class="bg-white/80 dark:bg-[#15202b]/80 backdrop-blur-xl rounded-2xl p-4 shadow-lg shadow-gray-200/50 dark:shadow-black/30 border border-gray-100/50 dark:border-gray-800/50 transition-all duration-300 hover-lift">
        <h3 class="text-sm font-semibold text-gray-800 dark:text-gray-200 mb-3 flex items-center gap-2">
            <span class="w-8 h-8 rounded-full bg-blue-500/20 flex items-center justify-center">
                <i class="fas fa-calendar-day text-blue-500 text-sm"></i>
            </span>
            Penjualan per Hari (7 Hari Terakhir)
        </h3>
        <div class="space-y-2">
            <template x-for="(item, idx) in dailySales" :key="idx">
                <div class="flex items-center gap-3 transition-all duration-300 hover:scale-[1.01]">
                    <span class="text-xs text-gray-500 w-24 font-medium" x-text="item.date"></span>
                    <div class="flex-1 bg-gray-200 dark:bg-gray-700 rounded-full h-6 overflow-hidden shadow-inner">
                        <div class="h-full bg-gradient-to-r from-[#1a5f7a] to-[#4a9ab8] rounded-full transition-all duration-700 flex items-center justify-end pr-2" 
                             :style="'width: ' + Math.max(item.percent, 3) + '%'">
                            <span class="text-[10px] text-white font-medium" x-text="'Rp ' + formatNumber(item.total)"></span>
                        </div>
                    </div>
                </div>
            </template>
            <template x-if="dailySales.length === 0">
                <div class="text-center text-gray-400 dark:text-gray-600 py-4 text-sm">
                    <div class="w-12 h-12 mx-auto rounded-full bg-gray-100 dark:bg-[#1a2835] flex items-center justify-center mb-2">
                        <i class="fas fa-calendar text-xl text-gray-300 dark:text-gray-600"></i>
                    </div>
                    Belum ada data penjualan
                </div>
            </template>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
