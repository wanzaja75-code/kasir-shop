<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Kasir Scan - WhatsApp</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="style.css" />

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; }
        .gradient-primary { background: linear-gradient(145deg, #0f2a44, #1a5f7a); }
        .gradient-wa { background: linear-gradient(145deg, #25D366, #128C7E); }
        .hover-lift { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .hover-lift:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 20px 40px -12px rgba(0,0,0,0.15); }
        .dark .hover-lift:hover { box-shadow: 0 20px 40px -12px rgba(0,0,0,0.4); }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #1a5f7a, #4a9ab8); border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #3a6a8a, #5a9ab8); }
        
        .wa-float { animation: wa-float 3s ease-in-out infinite; }
        @keyframes wa-float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
    </style>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { 500: '#1a5f7a', 600: '#154c62', 700: '#103949' },
                        wa: '#25D366'
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
</head>

<body x-data="kasirApp()" x-init="init()" :class="darkMode ? 'dark' : ''" class="min-h-screen p-3 md:p-5 transition-colors duration-500 bg-gray-50 dark:bg-[#0b1320]">

    <!-- HEADER PREMIUM -->
    <header class="relative rounded-2xl p-5 mb-4 overflow-hidden gradient-primary shadow-2xl shadow-[#0f2a44]/30">
        <div class="absolute inset-0 opacity-10">
            <svg class="w-full h-full" viewBox="0 0 100 100" preserveAspectRatio="none">
                <circle cx="80" cy="20" r="40" fill="white" />
                <circle cx="20" cy="80" r="30" fill="white" />
                <circle cx="50" cy="50" r="20" fill="white" />
            </svg>
        </div>
        <button @click="toggleTheme()" 
                class="absolute right-4 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 transition-all duration-300 flex items-center justify-center backdrop-blur-sm border border-white/10 hover:scale-110">
            <i class="fas text-lg" :class="darkMode ? 'fa-sun text-yellow-300' : 'fa-moon text-white'"></i>
        </button>
        <div class="text-center relative z-10">
            <div class="flex items-center justify-center gap-3 mb-1">
                <div class="w-12 h-12 rounded-2xl bg-white/10 backdrop-blur-sm flex items-center justify-center border border-white/20">
                    <i class="fab fa-whatsapp text-2xl text-white"></i>
                </div>
                <h1 class="text-2xl font-extrabold tracking-tight text-white">WhatsApp<span class="text-blue-200">Struk</span></h1>
            </div>
            <p class="text-sm text-blue-100/80 font-light" x-text="datetime"></p>
        </div>
    </header>

    <!-- NAVIGASI PREMIUM -->
    <nav class="bg-white/80 dark:bg-[#15202b]/80 backdrop-blur-xl rounded-2xl p-1.5 mb-4 shadow-lg shadow-gray-200/50 dark:shadow-black/30 border border-gray-100/50 dark:border-gray-800/50">
        <div class="grid grid-cols-5 gap-0.5">
            <a href="index.html" class="py-3 rounded-xl hover:bg-gray-100 dark:hover:bg-[#1a2835] text-gray-500 dark:text-gray-400 text-xs font-semibold flex flex-col items-center gap-1 transition-all duration-300">
                <i class="fas fa-home text-base"></i><span>Beranda</span>
            </a>
            <a href="produk.html" class="py-3 rounded-xl hover:bg-gray-100 dark:hover:bg-[#1a2835] text-gray-500 dark:text-gray-400 text-xs font-semibold flex flex-col items-center gap-1 transition-all duration-300">
                <i class="fas fa-boxes text-base"></i><span>Produk</span>
            </a>
            <a href="laporan.html" class="py-3 rounded-xl hover:bg-gray-100 dark:hover:bg-[#1a2835] text-gray-500 dark:text-gray-400 text-xs font-semibold flex flex-col items-center gap-1 transition-all duration-300">
                <i class="fas fa-chart-bar text-base"></i><span>Laporan</span>
            </a>
            <a href="wa.html" class="py-3 rounded-xl bg-[#1a5f7a] text-white text-xs font-semibold flex flex-col items-center gap-1 transition-all duration-300 shadow-lg shadow-[#1a5f7a]/30">
                <i class="fab fa-whatsapp text-base"></i><span>WhatsApp</span>
            </a>
            <a href="pengaturan.html" class="py-3 rounded-xl hover:bg-gray-100 dark:hover:bg-[#1a2835] text-gray-500 dark:text-gray-400 text-xs font-semibold flex flex-col items-center gap-1 transition-all duration-300">
                <i class="fas fa-sliders-h text-base"></i><span>Settings</span>
            </a>
        </div>
    </nav>

    <!-- KIRIM WA -->
    <div class="bg-white/80 dark:bg-[#15202b]/80 backdrop-blur-xl rounded-2xl p-5 shadow-lg shadow-gray-200/50 dark:shadow-black/30 border border-gray-100/50 dark:border-gray-800/50 transition-all duration-300 hover-lift">
        
        <!-- Icon WA -->
        <div class="text-center mb-5">
            <div class="w-24 h-24 mx-auto rounded-full gradient-wa flex items-center justify-center shadow-xl shadow-[#25D366]/30 wa-float">
                <i class="fab fa-whatsapp text-5xl text-white"></i>
            </div>
            <h3 class="text-lg font-bold text-gray-800 dark:text-gray-200 mt-3">Kirim Struk via WhatsApp</h3>
            <p class="text-sm text-gray-400">Kirim struk belanja langsung ke pelanggan</p>
        </div>

        <div class="space-y-4">
            <!-- Ringkasan Belanja -->
            <div class="bg-gray-50/80 dark:bg-[#1a2835]/80 rounded-xl p-4 border border-gray-100 dark:border-gray-800 transition-all duration-300 hover:bg-gray-100/80 dark:hover:bg-[#1f3040]/80">
                <p class="text-xs font-medium text-gray-500 dark:text-gray-400 mb-2 flex items-center gap-2">
                    <i class="fas fa-clipboard-list"></i> Ringkasan Belanja
                </p>
                <div class="space-y-1 max-h-32 overflow-y-auto">
                    <template x-for="item in cart" :key="item.id">
                        <div class="flex justify-between text-sm py-1 border-b border-gray-100 dark:border-gray-800 last:border-0">
                            <span class="text-gray-600 dark:text-gray-400" x-text="item.name + ' x' + item.qty"></span>
                            <span class="font-semibold text-gray-800 dark:text-gray-200" x-text="'Rp ' + formatNumber(item.price * item.qty)"></span>
                        </div>
                    </template>
                    <template x-if="cart.length === 0">
                        <div class="text-center text-gray-400 dark:text-gray-600 py-3 text-sm">
                            <i class="fas fa-shopping-cart text-xl block mb-1"></i>
                            Keranjang kosong
                        </div>
                    </template>
                </div>
                <div class="border-t border-gray-200 dark:border-gray-700 mt-2 pt-2 flex justify-between font-bold">
                    <span class="text-gray-800 dark:text-gray-200">Total</span>
                    <span class="text-[#1a5f7a] dark:text-[#5a9ab8]" x-text="'Rp ' + formatNumber(grandTotal)"></span>
                </div>
            </div>

            <!-- Input Nomor -->
            <div>
                <label class="text-xs font-medium text-gray-600 dark:text-gray-400 flex items-center gap-2">
                    <i class="fas fa-phone text-[#25D366]"></i> Nomor WhatsApp Pelanggan
                </label>
                <div class="flex gap-2 mt-1.5">
                    <span class="px-3 py-2.5 bg-gray-100 dark:bg-[#1a2835] rounded-xl text-sm text-gray-600 dark:text-gray-400 font-medium border border-gray-200 dark:border-gray-700">+62</span>
                    <input type="tel" x-model="waNumber" placeholder="8123456789" 
                           class="flex-1 px-4 py-2.5 rounded-xl border-2 border-gray-200 dark:border-gray-700 dark:bg-[#1a2835] dark:text-white text-sm focus:ring-4 focus:ring-[#25D366]/20 focus:border-[#25D366] outline-none transition-all duration-300 focus-ring">
                </div>
            </div>

            <!-- Tombol Kirim -->
            <button @click="sendWhatsAppDirect()" 
                    :disabled="cart.length === 0 || !waNumber || waNumber.replace(/[^0-9]/g,'').length < 8"
                    class="w-full py-3.5 rounded-xl gradient-wa hover:from-[#128C7E] hover:to-[#075E54] text-white font-semibold text-sm transition-all duration-300 shadow-xl shadow-[#25D366]/30 hover:shadow-2xl hover:shadow-[#25D366]/40 hover:scale-[1.02] active:scale-95 flex items-center justify-center gap-3 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:scale-100">
                <i class="fab fa-whatsapp text-xl"></i>
                <span x-text="cart.length === 0 ? 'Keranjang kosong' : 'Kirim via WhatsApp'"></span>
            </button>

            <!-- Riwayat WA -->
            <div class="mt-4 pt-4 border-t border-gray-100 dark:border-gray-800">
                <p class="text-xs font-medium text-gray-500 dark:text-gray-400 mb-2 flex items-center gap-2">
                    <i class="fas fa-history"></i> Riwayat Pengiriman WA
                </p>
                <div class="max-h-32 overflow-y-auto space-y-1">
                    <template x-for="(wa, idx) in waHistory" :key="idx">
                        <div class="flex justify-between items-center text-xs py-1.5 px-3 bg-gray-50/80 dark:bg-[#1a2835]/80 rounded-lg border border-gray-100 dark:border-gray-800">
                            <span class="text-gray-600 dark:text-gray-400 font-medium" x-text="wa.nomor"></span>
                            <span class="text-gray-400" x-text="wa.tanggal"></span>
                            <span class="text-emerald-500"><i class="fas fa-check-circle"></i></span>
                        </div>
                    </template>
                    <template x-if="waHistory.length === 0">
                        <div class="text-center text-gray-400 dark:text-gray-600 py-3 text-sm">
                            <i class="fas fa-inbox text-xl block mb-1"></i>
                            Belum ada riwayat
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
