<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Kasir Scan - WhatsApp</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="style.css" />

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { 500: '#1a5f7a', 600: '#154c62', 700: '#103949' },
                        wa: '#25D366'
                    }
                }
            }
        }
    </script>
</head>

<body x-data="kasirApp()" x-init="init()" :class="darkMode ? 'dark' : ''" class="min-h-screen p-3 md:p-5 transition-colors duration-300">

    <!-- HEADER -->
    <header class="relative bg-gradient-to-r from-[#0f2a44] to-[#1a5f7a] text-white rounded-2xl p-4 mb-4 shadow-xl">
        <button @click="toggleTheme()" class="absolute right-4 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-white/10 hover:bg-white/20 transition-all flex items-center justify-center">
            <i class="fas" :class="darkMode ? 'fa-sun' : 'fa-moon'"></i>
        </button>
        <div class="text-center">
            <h1 class="text-xl font-bold"><i class="fab fa-whatsapp mr-2"></i>WhatsApp</h1>
            <p class="text-xs opacity-80 mt-0.5" x-text="datetime"></p>
        </div>
    </header>

    <!-- NAVIGASI -->
    <nav class="bg-white dark:bg-[#15202b] rounded-2xl p-2 mb-4 shadow-sm">
        <div class="grid grid-cols-5 gap-1">
            <a href="index.html" class="py-2.5 rounded-xl hover:bg-gray-100 dark:hover:bg-[#1a2835] text-gray-500 dark:text-gray-400 text-xs font-semibold flex flex-col items-center gap-0.5 transition-all">
                <i class="fas fa-home text-base"></i><span>Beranda</span>
            </a>
            <a href="produk.html" class="py-2.5 rounded-xl hover:bg-gray-100 dark:hover:bg-[#1a2835] text-gray-500 dark:text-gray-400 text-xs font-semibold flex flex-col items-center gap-0.5 transition-all">
                <i class="fas fa-boxes text-base"></i><span>Produk</span>
            </a>
            <a href="laporan.html" class="py-2.5 rounded-xl hover:bg-gray-100 dark:hover:bg-[#1a2835] text-gray-500 dark:text-gray-400 text-xs font-semibold flex flex-col items-center gap-0.5 transition-all">
                <i class="fas fa-chart-bar text-base"></i><span>Laporan</span>
            </a>
            <a href="wa.html" class="py-2.5 rounded-xl bg-[#1a5f7a] text-white text-xs font-semibold flex flex-col items-center gap-0.5 transition-all">
                <i class="fab fa-whatsapp text-base"></i><span>WhatsApp</span>
            </a>
            <a href="pengaturan.html" class="py-2.5 rounded-xl hover:bg-gray-100 dark:hover:bg-[#1a2835] text-gray-500 dark:text-gray-400 text-xs font-semibold flex flex-col items-center gap-0.5 transition-all">
                <i class="fas fa-cog text-base"></i><span>Settings</span>
            </a>
        </div>
    </nav>

    <!-- ===== KIRIM WA ===== -->
    <div class="bg-white dark:bg-[#15202b] rounded-2xl p-4 shadow-sm">
        <div class="text-center mb-4">
            <div class="w-20 h-20 bg-green-500/20 rounded-full flex items-center justify-center mx-auto mb-2">
                <i class="fab fa-whatsapp text-4xl text-wa"></i>
            </div>
            <h3 class="text-lg font-bold text-gray-800 dark:text-gray-200">Kirim Struk via WhatsApp</h3>
            <p class="text-xs text-gray-400">Kirim struk belanja langsung ke pelanggan</p>
        </div>

        <div class="space-y-3">
            <!-- Ringkasan Belanja -->
            <div class="bg-gray-50 dark:bg-[#1a2835] rounded-xl p-3">
                <p class="text-xs text-gray-500 mb-1">📋 Ringkasan Belanja</p>
                <div class="space-y-0.5 max-h-32 overflow-y-auto">
                    <template x-for="item in cart" :key="item.id">
                        <div class="flex justify-between text-sm">
                            <span class="text-gray-600 dark:text-gray-400" x-text="item.name + ' x' + item.qty"></span>
                            <span class="font-semibold text-gray-800 dark:text-gray-200" x-text="'Rp ' + formatNumber(item.price * item.qty)"></span>
                        </div>
                    </template>
                    <template x-if="cart.length === 0">
                        <div class="text-center text-gray-400 py-2 text-sm">Keranjang kosong</div>
                    </template>
                </div>
                <div class="border-t border-gray-200 dark:border-gray-700 mt-1 pt-1">
                    <div class="flex justify-between font-bold">
                        <span class="text-gray-800 dark:text-gray-200">Total</span>
                        <span class="text-[#1a5f7a]" x-text="'Rp ' + formatNumber(grandTotal)"></span>
                    </div>
                </div>
            </div>

            <!-- Input Nomor -->
            <div>
                <label class="text-xs font-medium text-gray-600 dark:text-gray-400">📱 Nomor WhatsApp Pelanggan</label>
                <div class="flex gap-2 mt-1">
                    <span class="px-3 py-2 bg-gray-100 dark:bg-[#1a2835] rounded-lg text-sm text-gray-600">+62</span>
                    <input type="tel" x-model="waNumber" placeholder="8123456789" 
                           class="flex-1 px-3 py-2 rounded-lg border-2 border-gray-200 dark:border-gray-700 dark:bg-[#1a2835] dark:text-white text-sm focus:border-[#1a5f7a] outline-none transition-all">
                </div>
            </div>

            <!-- Tombol Kirim -->
            <button @click="sendWhatsAppDirect()" 
                    :disabled="cart.length === 0 || !waNumber || waNumber.length < 8"
                    class="w-full py-3 rounded-xl bg-wa hover:bg-green-600 text-white font-semibold text-sm transition-all duration-200 flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                <i class="fab fa-whatsapp text-lg"></i>
                <span x-text="cart.length === 0 ? 'Keranjang kosong' : 'Kirim via WhatsApp'"></span>
            </button>

            <!-- Riwayat WA -->
            <div class="mt-4 pt-3 border-t border-gray-100 dark:border-gray-800">
                <p class="text-xs text-gray-400 mb-1">📤 Riwayat Pengiriman WA</p>
                <div class="max-h-32 overflow-y-auto">
                    <template x-for="(wa, idx) in waHistory" :key="idx">
                        <div class="flex justify-between text-xs py-1 border-b border-gray-50 dark:border-gray-800">
                            <span class="text-gray-600 dark:text-gray-400" x-text="wa.nomor"></span>
                            <span class="text-gray-400" x-text="wa.tanggal"></span>
                            <span class="text-emerald-500"><i class="fas fa-check-circle"></i></span>
                        </div>
                    </template>
                    <template x-if="waHistory.length === 0">
                        <div class="text-center text-gray-400 py-2 text-xs">Belum ada riwayat</div>
                    </template>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="script.js"></script>
</body>
</html>
