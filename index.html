<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Kasir Scan Pro</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

    <link rel="stylesheet" href="style.css" />

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; }
        
        .gradient-primary { background: linear-gradient(145deg, #0f2a44, #1a5f7a); }
        .hover-lift { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .hover-lift:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 20px 40px -12px rgba(0,0,0,0.15); }
        .dark .hover-lift:hover { box-shadow: 0 20px 40px -12px rgba(0,0,0,0.4); }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #1a5f7a, #4a9ab8); border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #3a6a8a, #5a9ab8); }
        
        .pulse-dot { animation: pulse-dot 2s ease-in-out infinite; }
        @keyframes pulse-dot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.2); } }
        
        .notif-badge { position: relative; }
        .notif-badge .badge {
            position: absolute;
            top: -2px;
            right: -4px;
            background: #ef4444;
            color: white;
            font-size: 8px;
            font-weight: 700;
            min-width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
            animation: pulse-dot 2s ease-in-out infinite;
            border: 2px solid white;
        }
        .dark .notif-badge .badge { border-color: #15202b; }
    </style>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { 500: '#1a5f7a', 600: '#154c62', 700: '#103949' },
                        wa: '#25D366'
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
</head>

<body x-data="kasirApp()" x-init="init()" :class="darkMode ? 'dark' : ''" class="min-h-screen p-3 md:p-5 transition-colors duration-500 bg-gray-50 dark:bg-[#0b1320]">

    <!-- ===== HEADER PREMIUM ===== -->
    <header class="relative rounded-2xl p-5 mb-4 overflow-hidden gradient-primary shadow-2xl shadow-[#0f2a44]/30">
        <div class="absolute inset-0 opacity-10">
            <svg class="w-full h-full" viewBox="0 0 100 100" preserveAspectRatio="none">
                <circle cx="80" cy="20" r="40" fill="white" />
                <circle cx="20" cy="80" r="30" fill="white" />
                <circle cx="50" cy="50" r="20" fill="white" />
            </svg>
        </div>
        
        <button @click="toggleTheme()" 
                class="absolute right-4 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 transition-all duration-300 flex items-center justify-center backdrop-blur-sm border border-white/10 hover:scale-110">
            <i class="fas text-lg" :class="darkMode ? 'fa-sun text-yellow-300' : 'fa-moon text-white'"></i>
        </button>
        
        <div class="text-center relative z-10">
            <div class="flex items-center justify-center gap-3 mb-1">
                <div class="w-12 h-12 rounded-2xl bg-white/10 backdrop-blur-sm flex items-center justify-center border border-white/20">
                    <i class="fas fa-cash-register text-2xl text-white"></i>
                </div>
                <h1 class="text-2xl font-extrabold tracking-tight text-white">Kasir<span class="text-blue-200">Scan</span></h1>
            </div>
            <p class="text-sm text-blue-100/80 font-light" x-text="datetime"></p>
        </div>
    </header>

    <!-- ===== NOTIFICATION BAR ===== -->
    <div x-show="notifications.length > 0" 
         class="bg-white/80 dark:bg-[#15202b]/80 backdrop-blur-xl rounded-2xl p-3 mb-3 shadow-lg shadow-gray-200/50 dark:shadow-black/30 border border-gray-100/50 dark:border-gray-800/50 transition-all duration-300">
        
        <div class="flex items-center justify-between mb-2">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-full bg-red-500/20 flex items-center justify-center">
                    <i class="fas fa-bell text-red-500 text-sm"></i>
                </div>
                <span class="text-sm font-semibold text-gray-800 dark:text-gray-200">
                    Notifikasi
                    <span class="text-xs font-normal text-gray-400 ml-1" x-text="'(' + notifications.filter(n => !n.read).length + ' baru)'"></span>
                </span>
            </div>
            <div class="flex gap-1.5">
                <button @click="markAllRead()" 
                        class="text-xs text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 transition-all duration-300 hover:scale-105 px-2 py-1 rounded-lg hover:bg-gray-100 dark:hover:bg-[#1a2835]">
                    <i class="fas fa-check-double"></i> Baca Semua
                </button>
                <button @click="clearAllNotifications()" 
                        class="text-xs text-red-400 hover:text-red-600 transition-all duration-300 hover:scale-105 px-2 py-1 rounded-lg hover:bg-red-50 dark:hover:bg-red-950/20">
                    <i class="fas fa-trash-alt"></i> Hapus
                </button>
            </div>
        </div>
        
        <!-- Daftar Notifikasi -->
        <div class="max-h-48 overflow-y-auto space-y-1.5 pr-1">
            <template x-for="notif in notifications" :key="notif.id">
                <div class="flex items-start gap-3 p-2.5 rounded-xl transition-all duration-300 hover:scale-[1.01]"
                     :class="notif.read ? 
                             'bg-gray-50/50 dark:bg-[#1a2835]/30 opacity-70' : 
                             'bg-gray-50/80 dark:bg-[#1a2835]/80 border-l-4 ' + (
                                 notif.type === 'stok' ? 'border-red-500' :
                                 notif.type === 'hutang' ? 'border-purple-500' :
                                 notif.type === 'member' ? 'border-emerald-500' :
                                 notif.type === 'transaksi' ? 'border-blue-500' :
                                 'border-gray-400'
                             )">
                    
                    <!-- Icon -->
                    <div class="w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0"
                         :class="notif.type === 'stok' ? 'bg-red-100 dark:bg-red-900/30' :
                                 notif.type === 'hutang' ? 'bg-purple-100 dark:bg-purple-900/30' :
                                 notif.type === 'member' ? 'bg-emerald-100 dark:bg-emerald-900/30' :
                                 'bg-blue-100 dark:bg-blue-900/30'">
                        <i class="fas text-xs"
                           :class="notif.type === 'stok' ? 'fa-exclamation-triangle text-red-500' :
                                   notif.type === 'hutang' ? 'fa-hand-holding-usd text-purple-500' :
                                   notif.type === 'member' ? 'fa-user-plus text-emerald-500' :
                                   'fa-info-circle text-blue-500'"></i>
                    </div>
                    
                    <!-- Pesan -->
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-medium text-gray-800 dark:text-gray-200" x-text="notif.message"></p>
                        <div class="flex items-center gap-2 mt-0.5">
                            <span class="text-xs text-gray-400" x-text="notif.time"></span>
                            <span x-show="!notif.read" 
                                  class="w-1.5 h-1.5 rounded-full bg-red-500 inline-block"></span>
                            <span class="text-xs px-1.5 py-0.5 rounded-full"
                                  :class="notif.type === 'stok' ? 'bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400' :
                                          notif.type === 'hutang' ? 'bg-purple-100 dark:bg-purple-900/30 text-purple-600 dark:text-purple-400' :
                                          notif.type === 'member' ? 'bg-emerald-100 dark:bg-emerald-900/30 text-emerald-600 dark:text-emerald-400' :
                                          'bg-blue-100 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400'"
                                  x-text="notif.label"></span>
                        </div>
                    </div>
                    
                    <!-- Tombol aksi -->
                    <div class="flex gap-1 flex-shrink-0">
                        <button x-show="!notif.read" 
                                @click="markRead(notif.id)"
                                class="text-xs text-gray-400 hover:text-gray-600 transition-all duration-300 hover:scale-110 p-1">
                            <i class="fas fa-check"></i>
                        </button>
                        <button @click="removeNotification(notif.id)"
                                class="text-xs text-gray-400 hover:text-red-500 transition-all duration-300 hover:scale-110 p-1">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <!-- ===== NAVIGASI PREMIUM (dengan Badge) ===== -->
    <nav class="bg-white/80 dark:bg-[#15202b]/80 backdrop-blur-xl rounded-2xl p-1.5 mb-4 shadow-lg shadow-gray-200/50 dark:shadow-black/30 border border-gray-100/50 dark:border-gray-800/50">
        <div class="grid grid-cols-6 gap-0.5">
            <a href="index.html" class="py-3 rounded-xl bg-[#1a5f7a] text-white text-xs font-semibold flex flex-col items-center gap-1 transition-all duration-300 shadow-lg shadow-[#1a5f7a]/30 notif-badge">
                <i class="fas fa-home text-base"></i>
                <span>Beranda</span>
                <span x-show="unreadCount > 0" 
                      class="badge" 
                      x-text="unreadCount > 9 ? '9+' : unreadCount"></span>
            </a>
            <a href="produk.html" class="py-3 rounded-xl hover:bg-gray-100 dark:hover:bg-[#1a2835] text-gray-500 dark:text-gray-400 text-xs font-semibold flex flex-col items-center gap-1 transition-all duration-300">
                <i class="fas fa-boxes text-base"></i>
                <span>Produk</span>
            </a>
            <a href="laporan.html" class="py-3 rounded-xl hover:bg-gray-100 dark:hover:bg-[#1a2835] text-gray-500 dark:text-gray-400 text-xs font-semibold flex flex-col items-center gap-1 transition-all duration-300">
                <i class="fas fa-chart-bar text-base"></i>
                <span>Laporan</span>
            </a>
            <a href="member.html" class="py-3 rounded-xl hover:bg-gray-100 dark:hover:bg-[#1a2835] text-gray-500 dark:text-gray-400 text-xs font-semibold flex flex-col items-center gap-1 transition-all duration-300">
                <i class="fas fa-user-tie text-base"></i>
                <span>Member</span>
            </a>
            <a href="hutang.html" class="py-3 rounded-xl hover:bg-gray-100 dark:hover:bg-[#1a2835] text-gray-500 dark:text-gray-400 text-xs font-semibold flex flex-col items-center gap-1 transition-all duration-300">
                <i class="fas fa-hand-holding-usd text-base"></i>
                <span>Hutang</span>
            </a>
            <a href="pengaturan.html" class="py-3 rounded-xl hover:bg-gray-100 dark:hover:bg-[#1a2835] text-gray-500 dark:text-gray-400 text-xs font-semibold flex flex-col items-center gap-1 transition-all duration-300">
                <i class="fas fa-sliders-h text-base"></i>
                <span>Settings</span>
            </a>
        </div>
    </nav>

    <!-- ===== REST OF CONTENT (SCAN, CART, ETC) ===== -->
    <!-- ... (Sisanya sama seperti index.html sebelumnya) ... -->

    <script src="app.js"></script>
</body>
</html>
