<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Kasir Scan - Beranda</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>
    
    <!-- jsQR -->
    <script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"></script>

    <link rel="stylesheet" href="style.css" />

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            500: '#1a5f7a',
                            600: '#154c62',
                            700: '#103949',
                        }
                    }
                }
            }
        }
    </script>
</head>

<body x-data="kasirApp()" x-init="init()" :class="darkMode ? 'dark' : ''" class="min-h-screen p-3 md:p-5 transition-colors duration-300">

    <!-- ===== HEADER ===== -->
    <header class="relative bg-gradient-to-r from-[#0f2a44] to-[#1a5f7a] text-white rounded-2xl p-4 mb-4 shadow-xl shadow-[#0f2a44]/20">
        <button @click="toggleTheme()" 
                class="absolute right-4 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-white/10 hover:bg-white/20 transition-all duration-200 flex items-center justify-center">
            <i class="fas" :class="darkMode ? 'fa-sun' : 'fa-moon'"></i>
        </button>
        <div class="text-center">
            <h1 class="text-xl font-bold tracking-tight">
                <i class="fas fa-cash-register mr-2"></i> Kasir Scan
            </h1>
            <p class="text-xs opacity-80 mt-0.5" x-text="datetime"></p>
        </div>
    </header>

    <!-- ===== NAVIGASI ===== -->
    <nav class="bg-white dark:bg-[#15202b] rounded-2xl p-2 mb-4 shadow-sm">
        <div class="grid grid-cols-5 gap-1">
            <a href="index.html" class="py-2.5 rounded-xl bg-[#1a5f7a] text-white text-xs font-semibold flex flex-col items-center gap-0.5 transition-all">
                <i class="fas fa-home text-base"></i>
                <span>Beranda</span>
            </a>
            <a href="produk.html" class="py-2.5 rounded-xl hover:bg-gray-100 dark:hover:bg-[#1a2835] text-gray-500 dark:text-gray-400 text-xs font-semibold flex flex-col items-center gap-0.5 transition-all">
                <i class="fas fa-boxes text-base"></i>
                <span>Produk</span>
            </a>
            <a href="laporan.html" class="py-2.5 rounded-xl hover:bg-gray-100 dark:hover:bg-[#1a2835] text-gray-500 dark:text-gray-400 text-xs font-semibold flex flex-col items-center gap-0.5 transition-all">
                <i class="fas fa-chart-bar text-base"></i>
                <span>Laporan</span>
            </a>
            <a href="wa.html" class="py-2.5 rounded-xl hover:bg-gray-100 dark:hover:bg-[#1a2835] text-gray-500 dark:text-gray-400 text-xs font-semibold flex flex-col items-center gap-0.5 transition-all">
                <i class="fab fa-whatsapp text-base"></i>
                <span>WhatsApp</span>
            </a>
            <a href="pengaturan.html" class="py-2.5 rounded-xl hover:bg-gray-100 dark:hover:bg-[#1a2835] text-gray-500 dark:text-gray-400 text-xs font-semibold flex flex-col items-center gap-0.5 transition-all">
                <i class="fas fa-cog text-base"></i>
                <span>Settings</span>
            </a>
        </div>
    </nav>

    <!-- ===== SCAN SECTION ===== -->
    <div class="bg-white dark:bg-[#15202b] rounded-2xl p-4 mb-4 shadow-sm transition-all duration-300">
        
        <!-- Status -->
        <div class="flex items-center gap-3 px-4 py-2.5 rounded-xl mb-3 transition-all duration-300 text-sm"
             :class="{
                'bg-amber-50 dark:bg-amber-950/30 border-l-4 border-amber-400': status.type === 'info',
                'bg-emerald-50 dark:bg-emerald-950/30 border-l-4 border-emerald-500': status.type === 'success',
                'bg-red-50 dark:bg-red-950/30 border-l-4 border-red-500': status.type === 'error',
                'bg-blue-50 dark:bg-blue-950/30 border-l-4 border-blue-500': status.type === 'active'
             }">
            <i class="fas text-sm" :class="{
                'fa-info-circle': status.type === 'info',
                'fa-check-circle': status.type === 'success',
                'fa-exclamation-circle': status.type === 'error',
                'fa-camera': status.type === 'active'
            }"></i>
            <span class="font-medium dark:text-gray-200" x-text="status.message"></span>
        </div>

        <!-- Method Tabs -->
        <div class="flex gap-1 p-1 bg-gray-100 dark:bg-[#0f1a24] rounded-xl mb-3">
            <template x-for="method in methods" :key="method.id">
                <button @click="switchMethod(method.id)"
                        class="flex-1 py-2 px-2 rounded-lg text-xs font-semibold transition-all duration-200"
                        :class="activeMethod === method.id ? 
                                'bg-white dark:bg-[#1a2835] text-gray-900 dark:text-white shadow-md' : 
                                'text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200'">
                    <i class="fas" :class="method.icon"></i>
                    <span class="ml-1" x-text="method.label"></span>
                </button>
            </template>
        </div>

        <!-- Method Content -->
        <div class="transition-all duration-300">
            
            <!-- Manual Input -->
            <div x-show="activeMethod === 'manual'" x-transition.duration.200>
                <div class="flex gap-2 flex-wrap">
                    <input type="text" id="barcodeInput" x-model="barcodeInput" 
                           placeholder="Ketik kode barang..." 
                           @keydown.enter="addItem()"
                           class="flex-1 min-w-[100px] px-3 py-2.5 rounded-xl border-2 border-gray-200 dark:border-gray-700 dark:bg-[#1a2835] dark:text-white focus:border-[#1a5f7a] focus:ring-4 focus:ring-[#1a5f7a]/10 outline-none transition-all duration-200 text-sm">
                    <button @click="addItem()"
                            class="px-5 py-2.5 bg-[#1a5f7a] hover:bg-[#154c62] text-white font-semibold rounded-xl transition-all duration-200 hover:shadow-lg hover:shadow-[#1a5f7a]/25 text-sm whitespace-nowrap flex items-center gap-2">
                        <i class="fas fa-plus"></i> Tambah
                    </button>
                </div>
            </div>

            <!-- Upload Foto -->
            <div x-show="activeMethod === 'upload'" x-transition.duration.200>
                <div class="border-2 border-dashed border-gray-300 dark:border-gray-700 rounded-xl p-6 text-center cursor-pointer hover:border-[#1a5f7a] dark:hover:border-[#4a8aaa] transition-all duration-300 bg-gray-50/50 dark:bg-[#0f1a24]/50 hover:bg-gray-100/50 dark:hover:bg-[#1a2835]/50 relative">
                    <i class="fas fa-image text-4xl block mb-1 text-gray-400 dark:text-gray-600"></i>
                    <p class="text-sm text-gray-600 dark:text-gray-400 font-medium">Klik upload foto barcode / QR</p>
                    <p class="text-xs text-gray-400 dark:text-gray-500">PNG, JPG, WebP</p>
                    <input type="file" accept="image/*" capture="environment" 
                           @change="handleUpload($event)" class="absolute inset-0 opacity-0 cursor-pointer">
                </div>
                <div x-show="uploadResult.message" 
                     class="mt-2 px-4 py-2.5 rounded-xl text-sm font-medium transition-all duration-300"
                     :class="{
                        'bg-emerald-50 dark:bg-emerald-950/30 text-emerald-700 dark:text-emerald-400 border-l-4 border-emerald-500': uploadResult.type === 'success',
                        'bg-red-50 dark:bg-red-950/30 text-red-700 dark:text-red-400 border-l-4 border-red-500': uploadResult.type === 'error',
                        'bg-blue-50 dark:bg-blue-950/30 text-blue-700 dark:text-blue-400 border-l-4 border-blue-500': uploadResult.type === 'info'
                     }"
                     x-text="uploadResult.message">
                </div>
            </div>

            <!-- Camera Live -->
            <div x-show="activeMethod === 'camera'" x-transition.duration.200>
                <div class="relative w-full aspect-[4/3] bg-[#0f1724] rounded-xl overflow-hidden mb-2 min-h-[150px]">
                    <video id="video" autoplay playsinline muted class="w-full h-full object-cover hidden" :class="{'!block': cameraActive}"></video>
                    <div class="absolute inset-0 flex items-center justify-center flex-col text-white/80 pointer-events-none border-2 border-white/30 rounded-xl transition-all duration-300"
                         :class="{'!flex': cameraActive, 'hidden': !cameraActive}">
                        <i class="fas fa-camera text-2xl mb-1"></i>
                        <span class="text-sm">Arahkan ke Barcode / QR</span>
                        <span class="text-xs opacity-60 mt-0.5">Otomatis berhenti 15 detik</span>
                    </div>
                    <div class="absolute inset-0 flex flex-col items-center justify-center text-white/30 bg-[#0f1724] rounded-xl"
                         :class="{'hidden': cameraActive}">
                        <i class="fas fa-camera text-4xl mb-1"></i>
                        <p class="text-sm">Klik tombol di bawah</p>
                    </div>
                </div>
                <button @click="toggleCamera()"
                        class="w-full py-2.5 rounded-xl font-semibold text-sm transition-all duration-200 flex items-center justify-center gap-2"
                        :class="cameraActive ? 
                                'bg-red-500 hover:bg-red-600 text-white' : 
                                'bg-[#0f2a44] hover:bg-[#1a3d5c] text-white'">
                    <i class="fas" :class="cameraActive ? 'fa-stop' : 'fa-camera'"></i>
                    <span x-text="cameraActive ? 'Berhenti' : 'Mulai Kamera'"></span>
                </button>
            </div>
        </div>

        <!-- Quick Products -->
        <div class="mt-3">
            <div class="flex items-center gap-2 mb-1.5">
                <i class="fas fa-tags text-xs text-gray-400"></i>
                <span class="text-xs font-medium text-gray-500 dark:text-gray-400">Produk Cepat</span>
            </div>
            <div class="flex flex-wrap gap-1" id="quickProducts">
                <template x-for="product in quickProductsList" :key="product.code">
                    <button @click="quickAdd(product.code)"
                            class="px-2.5 py-1 rounded-full text-xs font-medium bg-gray-100 dark:bg-[#1a2835] text-gray-700 dark:text-gray-300 border border-gray-200 dark:border-gray-700 hover:bg-[#1a5f7a] hover:text-white hover:border-[#1a5f7a] transition-all duration-200 flex items-center gap-1">
                        <span x-text="product.name"></span>
                        <span class="text-[10px] text-gray-400" x-text="'(' + (product.stock || 0) + ')'"></span>
                    </button>
                </template>
            </div>
        </div>
    </div>

    <!-- ===== CART SECTION ===== -->
    <div class="bg-white dark:bg-[#15202b] rounded-2xl p-4 shadow-sm transition-all duration-300">
        <div class="flex justify-between items-center mb-2 pb-1.5 border-b-2 border-gray-100 dark:border-gray-800">
            <h2 class="text-sm font-semibold text-gray-800 dark:text-gray-200">
                <i class="fas fa-shopping-cart text-[#1a5f7a] dark:text-[#5a9ab8] mr-1.5"></i> Keranjang
                <span class="text-xs text-gray-400 ml-1" x-text="'(' + cart.length + ')'"></span>
            </h2>
            <button @click="clearCart()" class="text-xs text-red-400 hover:text-red-600 transition-all">
                <i class="fas fa-trash"></i> Kosong
            </button>
        </div>
        
        <!-- Cart Items -->
        <div class="max-h-52 overflow-y-auto mb-2 space-y-0.5" id="cartList">
            <template x-if="cart.length === 0">
                <div class="text-center text-gray-400 dark:text-gray-600 py-4 text-sm">
                    <i class="fas fa-box-open text-xl block mb-1"></i>
                    Belum ada barang
                </div>
            </template>
            <template x-for="item in cart" :key="item.id">
                <div class="flex items-center justify-between gap-1 p-2 bg-gray-50 dark:bg-[#1a2835] rounded-lg border-l-4 border-[#1a5f7a] transition-all duration-200 hover:bg-gray-100 dark:hover:bg-[#1f3040] fade-in text-sm">
                    <span class="font-medium text-gray-800 dark:text-gray-200 flex-1 min-w-[35px] text-xs" x-text="item.name"></span>
                    <span class="font-semibold text-[#1a5f7a] dark:text-[#5a9ab8] text-xs whitespace-nowrap" x-text="'Rp ' + formatNumber(item.price)"></span>
                    <span class="text-[10px] text-gray-400" x-text="item.unit || ''"></span>
                    <div class="flex items-center gap-0.5">
                        <button @click="changeQty(item.id, -1)" class="w-5 h-5 rounded-lg bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 font-bold text-xs transition-all flex items-center justify-center">−</button>
                        <span class="w-4 text-center font-semibold text-xs" x-text="item.qty"></span>
                        <button @click="changeQty(item.id, 1)" class="w-5 h-5 rounded-lg bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 font-bold text-xs transition-all flex items-center justify-center">+</button>
                    </div>
                    <span class="font-bold text-gray-800 dark:text-gray-200 min-w-[45px] text-right text-xs" x-text="'Rp ' + formatNumber(item.price * item.qty)"></span>
                    <button @click="removeItem(item.id)" class="text-red-500 hover:text-red-700 text-xs font-bold px-0.5 transition-all">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </template>
        </div>

        <!-- ===== TOTAL SECTION ===== -->
        <div class="space-y-1.5 pt-2 border-t-2 border-gray-100 dark:border-gray-800">
            
            <!-- Subtotal & Diskon -->
            <div class="grid grid-cols-2 gap-2">
                <div class="flex justify-between items-center px-2.5 py-1.5 bg-gray-50 dark:bg-[#1a2835] rounded-lg">
                    <span class="text-xs text-gray-600 dark:text-gray-400">Subtotal</span>
                    <span class="font-semibold text-xs text-gray-800 dark:text-gray-200" x-text="'Rp ' + formatNumber(subtotal)"></span>
                </div>
                <div class="flex justify-between items-center px-2.5 py-1.5 bg-gray-50 dark:bg-[#1a2835] rounded-lg">
                    <span class="text-xs text-gray-600 dark:text-gray-400">Diskon</span>
                    <div class="flex items-center gap-0.5">
                        <input type="number" x-model="discount" min="0" max="100" 
                               class="w-10 px-1 py-0.5 rounded-lg border-2 border-gray-200 dark:border-gray-700 dark:bg-[#1a2835] dark:text-white text-xs text-right focus:border-[#1a5f7a] outline-none transition-all">
                        <span class="text-xs text-gray-600 dark:text-gray-400">%</span>
                    </div>
                </div>
            </div>

            <!-- Grand Total -->
            <div class="flex justify-between items-center px-3 py-2 bg-[#1a5f7a]/10 dark:bg-[#1a5f7a]/20 rounded-lg border border-[#1a5f7a]/30">
                <span class="text-sm font-bold text-gray-800 dark:text-gray-200">
                    <i class="fas fa-calculator mr-1.5 text-[#1a5f7a]"></i> Total
                </span>
                <span class="text-lg font-bold text-[#1a5f7a] dark:text-[#5a9ab8]" x-text="'Rp ' + formatNumber(grandTotal)"></span>
            </div>

            <!-- Payment & Change -->
            <div class="grid grid-cols-2 gap-2">
                <div class="flex justify-between items-center px-2.5 py-1.5 bg-gray-50 dark:bg-[#1a2835] rounded-lg">
                    <span class="text-xs text-gray-600 dark:text-gray-400">
                        <i class="fas fa-money-bill-wave mr-1 text-gray-400"></i> Bayar
                    </span>
                    <input type="number" x-model="payment" min="0" 
                           class="w-16 px-1.5 py-0.5 rounded-lg border-2 border-gray-200 dark:border-gray-700 dark:bg-[#1a2835] dark:text-white text-xs text-right focus:border-[#1a5f7a] outline-none transition-all">
                </div>
                <div class="flex justify-between items-center px-2.5 py-1.5 rounded-lg" 
                     :class="change >= 0 ? 'bg-emerald-50 dark:bg-emerald-950/20' : 'bg-red-50 dark:bg-red-950/20'">
                    <span class="text-xs text-gray-600 dark:text-gray-400">
                        <i class="fas fa-rotate-left mr-1" :class="change >= 0 ? 'text-emerald-500' : 'text-red-500'"></i> Kembali
                    </span>
                    <span class="font-bold text-xs" 
                          :class="change >= 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-red-500'">
                        <span x-text="change >= 0 ? 'Rp ' + formatNumber(change) : '❌'"></span>
                    </span>
                </div>
            </div>

            <!-- Tombol Aksi -->
            <div class="flex gap-1.5 mt-2 flex-wrap">
                <button @click="printReceipt()" 
                        class="flex-1 min-w-[50px] py-2 rounded-xl bg-[#1a5f7a] hover:bg-[#154c62] text-white font-semibold text-xs transition-all flex items-center justify-center gap-1.5">
                    <i class="fas fa-print"></i> Cetak
                </button>
                <button @click="sendWhatsApp()" 
                        class="flex-1 min-w-[50px] py-2 rounded-xl bg-green-500 hover:bg-green-600 text-white font-semibold text-xs transition-all flex items-center justify-center gap-1.5">
                    <i class="fab fa-whatsapp"></i> WA
                </button>
                <button @click="saveData()" 
                        class="flex-1 min-w-[50px] py-2 rounded-xl bg-gray-500 hover:bg-gray-600 text-white font-semibold text-xs transition-all flex items-center justify-center gap-1.5">
                    <i class="fas fa-save"></i> Simpan
                </button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="script.js"></script>
</body>
</html>
