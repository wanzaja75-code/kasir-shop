<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Kasir Scan Pro</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>
    
    <!-- jsQR -->
    <script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"></script>
    
    <!-- JsBarcode -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

    <link rel="stylesheet" href="style.css" />

    <style>
        /* ===== TAILWIND CUSTOM ===== */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        * { font-family: 'Inter', sans-serif; }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .dark .glass-card {
            background: rgba(21, 32, 43, 0.8);
            border-color: rgba(255, 255, 255, 0.05);
        }
        
        .gradient-primary {
            background: linear-gradient(145deg, #0f2a44, #1a5f7a);
        }
        
        .gradient-success {
            background: linear-gradient(145deg, #059669, #10b981);
        }
        
        .gradient-warning {
            background: linear-gradient(145deg, #d97706, #f59e0b);
        }
        
        .gradient-danger {
            background: linear-gradient(145deg, #dc2626, #ef4444);
        }
        
        .hover-lift {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .hover-lift:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.15);
        }
        
        .dark .hover-lift:hover {
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.4);
        }
        
        /* Smooth scroll */
        html { scroll-behavior: smooth; }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { 
            background: linear-gradient(180deg, #1a5f7a, #4a9ab8);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover { background: #1a5f7a; }
        
        .dark ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #3a6a8a, #5a9ab8);
        }
        
        /* Input focus */
        .focus-ring {
            transition: all 0.3s ease;
        }
        .focus-ring:focus {
            ring: 4px solid rgba(26, 95, 122, 0.15);
            border-color: #1a5f7a;
        }
        
        /* Animasi pulse untuk status */
        .pulse-dot {
            animation: pulse-dot 2s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }
    </style>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { 50: '#f0f7fa', 100: '#d9ecf2', 200: '#b3d9e5', 300: '#8cc6d8', 400: '#66b3cb', 500: '#1a5f7a', 600: '#154c62', 700: '#103949', 800: '#0a2631', 900: '#051318' },
                        wa: '#25D366',
                        dark: { 50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 300: '#cbd5e1', 400: '#94a3b8', 500: '#64748b', 600: '#475569', 700: '#334155', 800: '#1e293b', 900: '#0f172a' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    animation: { 'float': 'float 6s ease-in-out infinite' },
                    keyframes: { float: { '0%, 100%': { transform: 'translateY(0px)' }, '50%': { transform: 'translateY(-10px)' } } }
                }
            }
        }
    </script>
</head>

<body x-data="kasirApp()" x-init="init()" :class="darkMode ? 'dark' : ''" class="min-h-screen p-3 md:p-5 transition-colors duration-500 bg-gray-50 dark:bg-[#0b1320]">

    <!-- ===== HEADER PREMIUM ===== -->
    <header class="relative rounded-2xl p-5 mb-4 overflow-hidden gradient-primary shadow-2xl shadow-[#0f2a44]/30">
        <div class="absolute inset-0 opacity-10">
            <svg class="w-full h-full" viewBox="0 0 100 100" preserveAspectRatio="none">
                <circle cx="80" cy="20" r="40" fill="white" />
                <circle cx="20" cy="80" r="30" fill="white" />
                <circle cx="50" cy="50" r="20" fill="white" />
            </svg>
        </div>
        
        <button @click="toggleTheme()" 
                class="absolute right-4 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 transition-all duration-300 flex items-center justify-center backdrop-blur-sm border border-white/10 hover:scale-110">
            <i class="fas text-lg" :class="darkMode ? 'fa-sun text-yellow-300' : 'fa-moon text-white'"></i>
        </button>
        
        <div class="text-center relative z-10">
            <div class="flex items-center justify-center gap-3 mb-1">
                <div class="w-12 h-12 rounded-2xl bg-white/10 backdrop-blur-sm flex items-center justify-center border border-white/20">
                    <i class="fas fa-cash-register text-2xl text-white"></i>
                </div>
                <h1 class="text-2xl font-extrabold tracking-tight text-white">Kasir<span class="text-blue-200">Scan</span></h1>
            </div>
            <p class="text-sm text-blue-100/80 font-light" x-text="datetime"></p>
        </div>
    </header>

    <!-- ===== NAVIGASI PREMIUM ===== -->
    <nav class="bg-white/80 dark:bg-[#15202b]/80 backdrop-blur-xl rounded-2xl p-1.5 mb-4 shadow-lg shadow-gray-200/50 dark:shadow-black/30 border border-gray-100/50 dark:border-gray-800/50">
        <div class="grid grid-cols-5 gap-0.5">
            <a href="index.html" class="py-3 rounded-xl bg-[#1a5f7a] text-white text-xs font-semibold flex flex-col items-center gap-1 transition-all duration-300 shadow-lg shadow-[#1a5f7a]/30">
                <i class="fas fa-home text-base"></i>
                <span>Beranda</span>
            </a>
            <a href="produk.html" class="py-3 rounded-xl hover:bg-gray-100 dark:hover:bg-[#1a2835] text-gray-500 dark:text-gray-400 text-xs font-semibold flex flex-col items-center gap-1 transition-all duration-300">
                <i class="fas fa-boxes text-base"></i>
                <span>Produk</span>
            </a>
            <a href="laporan.html" class="py-3 rounded-xl hover:bg-gray-100 dark:hover:bg-[#1a2835] text-gray-500 dark:text-gray-400 text-xs font-semibold flex flex-col items-center gap-1 transition-all duration-300">
                <i class="fas fa-chart-bar text-base"></i>
                <span>Laporan</span>
            </a>
            <a href="wa.html" class="py-3 rounded-xl hover:bg-gray-100 dark:hover:bg-[#1a2835] text-gray-500 dark:text-gray-400 text-xs font-semibold flex flex-col items-center gap-1 transition-all duration-300">
                <i class="fab fa-whatsapp text-base"></i>
                <span>WhatsApp</span>
            </a>
            <a href="pengaturan.html" class="py-3 rounded-xl hover:bg-gray-100 dark:hover:bg-[#1a2835] text-gray-500 dark:text-gray-400 text-xs font-semibold flex flex-col items-center gap-1 transition-all duration-300">
                <i class="fas fa-sliders-h text-base"></i>
                <span>Settings</span>
            </a>
        </div>
    </nav>

    <!-- ===== SCAN SECTION PREMIUM ===== -->
    <div class="bg-white/80 dark:bg-[#15202b]/80 backdrop-blur-xl rounded-2xl p-4 mb-4 shadow-lg shadow-gray-200/50 dark:shadow-black/30 border border-gray-100/50 dark:border-gray-800/50 transition-all duration-300 hover-lift">
        
        <!-- Status Premium -->
        <div class="flex items-center gap-3 px-4 py-3 rounded-xl mb-4 transition-all duration-500 border"
             :class="{
                'bg-amber-50 dark:bg-amber-950/20 border-amber-200 dark:border-amber-800/30': status.type === 'info',
                'bg-emerald-50 dark:bg-emerald-950/20 border-emerald-200 dark:border-emerald-800/30': status.type === 'success',
                'bg-red-50 dark:bg-red-950/20 border-red-200 dark:border-red-800/30': status.type === 'error',
                'bg-blue-50 dark:bg-blue-950/20 border-blue-200 dark:border-blue-800/30': status.type === 'active'
             }">
            <div class="w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0"
                 :class="{
                    'bg-amber-100 dark:bg-amber-900/30': status.type === 'info',
                    'bg-emerald-100 dark:bg-emerald-900/30': status.type === 'success',
                    'bg-red-100 dark:bg-red-900/30': status.type === 'error',
                    'bg-blue-100 dark:bg-blue-900/30': status.type === 'active'
                 }">
                <i class="fas text-sm" :class="{
                    'fa-info-circle text-amber-500': status.type === 'info',
                    'fa-check-circle text-emerald-500': status.type === 'success',
                    'fa-exclamation-circle text-red-500': status.type === 'error',
                    'fa-camera text-blue-500': status.type === 'active'
                }"></i>
            </div>
            <span class="text-sm font-medium dark:text-gray-200" x-text="status.message"></span>
            <span x-show="status.type === 'active'" class="ml-auto flex items-center gap-1.5 text-xs text-blue-500">
                <span class="pulse-dot w-2 h-2 rounded-full bg-blue-500 inline-block"></span>
                Live
            </span>
        </div>

        <!-- Method Tabs Premium -->
        <div class="flex gap-1 p-1 bg-gray-100/80 dark:bg-[#0f1a24]/80 rounded-xl mb-4 backdrop-blur-sm">
            <template x-for="method in methods" :key="method.id">
                <button @click="switchMethod(method.id)"
                        class="flex-1 py-2.5 px-2 rounded-lg text-xs font-semibold transition-all duration-300"
                        :class="activeMethod === method.id ? 
                                'bg-white dark:bg-[#1a2835] text-gray-900 dark:text-white shadow-lg shadow-gray-200/50 dark:shadow-black/30 scale-[1.02]' : 
                                'text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 hover:bg-white/50 dark:hover:bg-[#1a2835]/50'">
                    <i class="fas" :class="method.icon"></i>
                    <span class="ml-1.5" x-text="method.label"></span>
                </button>
            </template>
        </div>

        <!-- Method Content -->
        <div class="transition-all duration-300">
            
            <!-- Manual Input -->
            <div x-show="activeMethod === 'manual'" x-transition.duration.300>
                <div class="flex gap-2 flex-wrap">
                    <input type="text" id="barcodeInput" x-model="barcodeInput" 
                           placeholder="Ketik kode barang..." 
                           @keydown.enter="addItem()"
                           class="flex-1 min-w-[100px] px-4 py-3 rounded-xl border-2 border-gray-200 dark:border-gray-700 dark:bg-[#1a2835] dark:text-white focus:ring-4 focus:ring-[#1a5f7a]/15 focus:border-[#1a5f7a] outline-none transition-all duration-300 text-sm focus-ring">
                    <button @click="addItem()"
                            class="px-6 py-3 bg-[#1a5f7a] hover:bg-[#154c62] text-white font-semibold rounded-xl transition-all duration-300 hover:shadow-xl hover:shadow-[#1a5f7a]/30 hover:scale-[1.02] active:scale-95 text-sm whitespace-nowrap flex items-center gap-2">
                        <i class="fas fa-plus"></i> Tambah
                    </button>
                </div>
            </div>

            <!-- Upload Foto -->
            <div x-show="activeMethod === 'upload'" x-transition.duration.300>
                <div class="border-2 border-dashed border-gray-300 dark:border-gray-700 rounded-xl p-8 text-center cursor-pointer hover:border-[#1a5f7a] dark:hover:border-[#4a8aaa] transition-all duration-500 bg-gray-50/50 dark:bg-[#0f1a24]/30 hover:bg-gray-100/50 dark:hover:bg-[#1a2835]/30 hover:scale-[1.02] relative group">
                    <div class="w-16 h-16 mx-auto rounded-full bg-[#1a5f7a]/10 dark:bg-[#1a5f7a]/20 flex items-center justify-center mb-3 group-hover:scale-110 transition-all duration-300">
                        <i class="fas fa-image text-3xl text-[#1a5f7a] dark:text-[#4a8aaa]"></i>
                    </div>
                    <p class="text-sm text-gray-600 dark:text-gray-400 font-medium">Klik untuk upload foto</p>
                    <p class="text-xs text-gray-400 dark:text-gray-500 mt-1">Barcode / QR Code · PNG, JPG, WebP</p>
                    <input type="file" accept="image/*" capture="environment" 
                           @change="handleUpload($event)" class="absolute inset-0 opacity-0 cursor-pointer">
                </div>
                <div x-show="uploadResult.message" 
                     class="mt-3 px-4 py-3 rounded-xl text-sm font-medium transition-all duration-500"
                     :class="{
                        'bg-emerald-50 dark:bg-emerald-950/20 text-emerald-700 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-800/30': uploadResult.type === 'success',
                        'bg-red-50 dark:bg-red-950/20 text-red-700 dark:text-red-400 border border-red-200 dark:border-red-800/30': uploadResult.type === 'error',
                        'bg-blue-50 dark:bg-blue-950/20 text-blue-700 dark:text-blue-400 border border-blue-200 dark:border-blue-800/30': uploadResult.type === 'info'
                     }"
                     x-text="uploadResult.message">
                </div>
            </div>

            <!-- Camera Live -->
            <div x-show="activeMethod === 'camera'" x-transition.duration.300>
                <div class="relative w-full aspect-[4/3] bg-[#0f1724] rounded-xl overflow-hidden mb-3 min-h-[180px] shadow-inner">
                    <video id="video" autoplay playsinline muted class="w-full h-full object-cover hidden" :class="{'!block': cameraActive}"></video>
                    <div class="absolute inset-0 flex items-center justify-center flex-col text-white/80 pointer-events-none border-2 border-white/20 rounded-xl transition-all duration-500"
                         :class="{'!flex': cameraActive, 'hidden': !cameraActive}">
                        <div class="w-16 h-16 rounded-full bg-white/10 backdrop-blur-sm flex items-center justify-center mb-3">
                            <i class="fas fa-camera text-3xl"></i>
                        </div>
                        <span class="text-lg font-medium">Arahkan ke Barcode</span>
                        <span class="text-xs opacity-60 mt-1">Otomatis berhenti 15 detik</span>
                    </div>
                    <div class="absolute inset-0 flex flex-col items-center justify-center text-white/30 bg-[#0f1724] rounded-xl"
                         :class="{'hidden': cameraActive}">
                        <div class="w-16 h-16 rounded-full bg-white/5 flex items-center justify-center mb-3">
                            <i class="fas fa-camera text-4xl"></i>
                        </div>
                        <p class="text-sm">Klik tombol di bawah</p>
                    </div>
                </div>
                <button @click="toggleCamera()"
                        class="w-full py-3.5 rounded-xl font-semibold text-sm transition-all duration-300 flex items-center justify-center gap-2 hover:scale-[1.02] active:scale-95"
                        :class="cameraActive ? 
                                'bg-gradient-to-r from-red-500 to-red-600 hover:from-red-600 hover:to-red-700 text-white shadow-lg shadow-red-500/30' : 
                                'bg-gradient-to-r from-[#0f2a44] to-[#1a5f7a] hover:from-[#1a3d5c] hover:to-[#1a5f7a] text-white shadow-lg shadow-[#0f2a44]/30'">
                    <i class="fas" :class="cameraActive ? 'fa-stop' : 'fa-camera'"></i>
                    <span x-text="cameraActive ? 'Berhenti' : 'Mulai Kamera'"></span>
                </button>
            </div>
        </div>

        <!-- Quick Products -->
        <div class="mt-4 pt-3 border-t border-gray-100 dark:border-gray-800">
            <div class="flex items-center gap-2 mb-2">
                <i class="fas fa-tags text-xs text-[#1a5f7a]"></i>
                <span class="text-xs font-medium text-gray-500 dark:text-gray-400">Produk Cepat</span>
                <span class="text-[10px] text-gray-400 ml-auto" x-text="quickProductsList.length + ' produk'"></span>
            </div>
            <div class="flex flex-wrap gap-1.5" id="quickProducts">
                <template x-for="product in quickProductsList" :key="product.code">
                    <button @click="quickAdd(product.code)"
                            class="px-3 py-1.5 rounded-full text-xs font-medium bg-gray-100 dark:bg-[#1a2835] text-gray-700 dark:text-gray-300 border border-gray-200 dark:border-gray-700 hover:bg-[#1a5f7a] hover:text-white hover:border-[#1a5f7a] hover:shadow-md transition-all duration-300 hover:scale-105 flex items-center gap-1.5">
                        <span x-text="product.name"></span>
                        <span class="text-[10px] text-gray-400" x-text="'(' + (product.stock || 0) + ')'"></span>
                    </button>
                </template>
            </div>
        </div>
    </div>

    <!-- ===== CART SECTION PREMIUM ===== -->
    <div class="bg-white/80 dark:bg-[#15202b]/80 backdrop-blur-xl rounded-2xl p-4 shadow-lg shadow-gray-200/50 dark:shadow-black/30 border border-gray-100/50 dark:border-gray-800/50 transition-all duration-300 hover-lift">
        <div class="flex justify-between items-center mb-3 pb-2 border-b border-gray-100 dark:border-gray-800">
            <h2 class="text-sm font-semibold text-gray-800 dark:text-gray-200 flex items-center gap-2">
                <i class="fas fa-shopping-cart text-[#1a5f7a] dark:text-[#5a9ab8]"></i>
                Keranjang
                <span class="text-xs font-normal text-gray-400 ml-1" x-text="'(' + cart.length + ')'"></span>
            </h2>
            <button @click="clearCart()" class="text-xs text-red-400 hover:text-red-600 transition-all duration-300 hover:scale-110 flex items-center gap-1">
                <i class="fas fa-trash-alt"></i> Kosong
            </button>
        </div>
        
        <!-- Cart Items -->
        <div class="max-h-52 overflow-y-auto mb-3 space-y-1" id="cartList">
            <template x-if="cart.length === 0">
                <div class="text-center text-gray-400 dark:text-gray-600 py-6 text-sm">
                    <div class="w-12 h-12 mx-auto rounded-full bg-gray-100 dark:bg-[#1a2835] flex items-center justify-center mb-2">
                        <i class="fas fa-box-open text-xl text-gray-300 dark:text-gray-600"></i>
                    </div>
                    Belum ada barang
                </div>
            </template>
            <template x-for="item in cart" :key="item.id">
                <div class="flex items-center justify-between gap-1 p-2.5 bg-gray-50/80 dark:bg-[#1a2835]/80 rounded-xl border-l-4 border-[#1a5f7a] transition-all duration-300 hover:bg-gray-100/80 dark:hover:bg-[#1f3040]/80 hover:scale-[1.01] text-sm">
                    <span class="font-medium text-gray-800 dark:text-gray-200 flex-1 min-w-[35px] text-xs" x-text="item.name"></span>
                    <span class="font-semibold text-[#1a5f7a] dark:text-[#5a9ab8] text-xs whitespace-nowrap" x-text="'Rp ' + formatNumber(item.price)"></span>
                    <span class="text-[10px] text-gray-400" x-text="item.unit || ''"></span>
                    <div class="flex items-center gap-0.5">
                        <button @click="changeQty(item.id, -1)" class="w-5 h-5 rounded-lg bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 font-bold text-xs transition-all duration-300 hover:scale-110 flex items-center justify-center">−</button>
                        <span class="w-5 text-center font-semibold text-xs" x-text="item.qty"></span>
                        <button @click="changeQty(item.id, 1)" class="w-5 h-5 rounded-lg bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 font-bold text-xs transition-all duration-300 hover:scale-110 flex items-center justify-center">+</button>
                    </div>
                    <span class="font-bold text-gray-800 dark:text-gray-200 min-w-[50px] text-right text-xs" x-text="'Rp ' + formatNumber(item.price * item.qty)"></span>
                    <button @click="removeItem(item.id)" class="text-red-400 hover:text-red-600 text-xs font-bold px-1 transition-all duration-300 hover:scale-125">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </template>
        </div>

        <!-- ===== TOTAL SECTION PREMIUM ===== -->
        <div class="space-y-2 pt-3 border-t-2 border-gray-100 dark:border-gray-800">
            
            <!-- Subtotal & Diskon -->
            <div class="grid grid-cols-2 gap-2">
                <div class="flex justify-between items-center px-3 py-2.5 bg-gray-50/80 dark:bg-[#1a2835]/80 rounded-xl transition-all duration-300 hover:bg-gray-100/80 dark:hover:bg-[#253544]/80">
                    <span class="text-xs text-gray-500 dark:text-gray-400">Subtotal</span>
                    <span class="font-semibold text-sm text-gray-800 dark:text-gray-200" x-text="'Rp ' + formatNumber(subtotal)"></span>
                </div>
                <div class="flex justify-between items-center px-3 py-2.5 bg-gray-50/80 dark:bg-[#1a2835]/80 rounded-xl transition-all duration-300 hover:bg-gray-100/80 dark:hover:bg-[#253544]/80">
                    <span class="text-xs text-gray-500 dark:text-gray-400">Diskon</span>
                    <div class="flex items-center gap-1">
                        <input type="number" x-model="discount" min="0" max="100" 
                               class="w-12 px-1.5 py-0.5 rounded-lg border-2 border-gray-200 dark:border-gray-700 dark:bg-[#1a2835] dark:text-white text-xs text-right focus:ring-2 focus:ring-[#1a5f7a]/30 focus:border-[#1a5f7a] outline-none transition-all duration-300">
                        <span class="text-xs text-gray-500 dark:text-gray-400">%</span>
                    </div>
                </div>
            </div>

            <!-- Grand Total Premium -->
            <div class="flex justify-between items-center px-4 py-3.5 rounded-xl bg-gradient-to-r from-[#1a5f7a]/10 to-[#4a9ab8]/10 dark:from-[#1a5f7a]/20 dark:to-[#4a9ab8]/20 border border-[#1a5f7a]/20 dark:border-[#4a9ab8]/20 transition-all duration-300 hover:scale-[1.01]">
                <span class="text-sm font-bold text-gray-800 dark:text-gray-200">
                    <i class="fas fa-calculator mr-2 text-[#1a5f7a]"></i> Total
                </span>
                <span class="text-xl font-extrabold text-[#1a5f7a] dark:text-[#5a9ab8]" x-text="'Rp ' + formatNumber(grandTotal)"></span>
            </div>

            <!-- Payment & Change -->
            <div class="grid grid-cols-2 gap-2">
                <div class="flex justify-between items-center px-3 py-2.5 bg-gray-50/80 dark:bg-[#1a2835]/80 rounded-xl transition-all duration-300 hover:bg-gray-100/80 dark:hover:bg-[#253544]/80">
                    <span class="text-xs text-gray-500 dark:text-gray-400">
                        <i class="fas fa-money-bill-wave mr-1.5 text-gray-400"></i> Bayar
                    </span>
                    <input type="number" x-model="payment" min="0" 
                           class="w-20 px-2 py-1 rounded-lg border-2 border-gray-200 dark:border-gray-700 dark:bg-[#1a2835] dark:text-white text-xs text-right focus:ring-2 focus:ring-[#1a5f7a]/30 focus:border-[#1a5f7a] outline-none transition-all duration-300">
                </div>
                <div class="flex justify-between items-center px-3 py-2.5 rounded-xl transition-all duration-300" 
                     :class="change >= 0 ? 'bg-emerald-50/80 dark:bg-emerald-950/20 border border-emerald-200 dark:border-emerald-800/30' : 'bg-red-50/80 dark:bg-red-950/20 border border-red-200 dark:border-red-800/30'">
                    <span class="text-xs text-gray-500 dark:text-gray-400">
                        <i class="fas fa-rotate-left mr-1.5" :class="change >= 0 ? 'text-emerald-500' : 'text-red-500'"></i> Kembali
                    </span>
                    <span class="font-bold text-sm" 
                          :class="change >= 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-red-500'">
                        <span x-text="change >= 0 ? 'Rp ' + formatNumber(change) : '❌ Kurang'"></span>
                    </span>
                </div>
            </div>

            <!-- Tombol Aksi Premium -->
            <div class="flex gap-2 mt-2 flex-wrap">
                <button @click="printReceipt()" 
                        class="flex-1 min-w-[60px] py-2.5 rounded-xl bg-gradient-to-r from-[#1a5f7a] to-[#2a7a9a] hover:from-[#154c62] hover:to-[#1a5f7a] text-white font-semibold text-xs transition-all duration-300 hover:shadow-xl hover:shadow-[#1a5f7a]/30 hover:scale-[1.02] active:scale-95 flex items-center justify-center gap-2">
                    <i class="fas fa-print"></i> Cetak
                </button>
                <button @click="window.location.href='wa.html'" 
                        class="flex-1 min-w-[60px] py-2.5 rounded-xl bg-gradient-to-r from-[#25D366] to-[#128C7E] hover:from-[#128C7E] hover:to-[#075E54] text-white font-semibold text-xs transition-all duration-300 hover:shadow-xl hover:shadow-[#25D366]/30 hover:scale-[1.02] active:scale-95 flex items-center justify-center gap-2">
                    <i class="fab fa-whatsapp"></i> WA
                </button>
                <button @click="saveData()" 
                        class="flex-1 min-w-[60px] py-2.5 rounded-xl bg-gradient-to-r from-gray-500 to-gray-600 hover:from-gray-600 hover:to-gray-700 text-white font-semibold text-xs transition-all duration-300 hover:shadow-xl hover:shadow-gray-500/30 hover:scale-[1.02] active:scale-95 flex items-center justify-center gap-2">
                    <i class="fas fa-save"></i> Simpan
                </button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
